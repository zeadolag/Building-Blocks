<style>
:root{
  --paper:#EEF1F0; --surface:#FFFFFF; --ink:#18222E; --muted:#5C6875; --line:#D3D9DD; --field:#F5F7F7;
  --red:#D3352B; --blue:#2457D6; --dayblue:#2457D6; --yellow:#E8AE0C; --green:#1E8E52; --black:#2B2F36;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12171D; --surface:#1B222B; --ink:#E7ECEF; --muted:#97A3AF; --line:#2E3742; --field:#151B22;
    --red:#E5534A; --blue:#5582F2; --dayblue:#5582F2; --yellow:#F0BC2C; --green:#2FA866; --black:#A7B0BA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12171D; --surface:#1B222B; --ink:#E7ECEF; --muted:#97A3AF; --line:#2E3742; --field:#151B22;
  --red:#E5534A; --blue:#5582F2; --dayblue:#5582F2; --yellow:#F0BC2C; --green:#2FA866; --black:#A7B0BA;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 Barlow,"Helvetica Neue",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;margin:0;line-height:1.05}

.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:6px 0 10px}
.top .date{text-align:center}
.top h1{font-size:34px;font-weight:700;letter-spacing:.01em}
.top p{margin:2px 0 0;color:var(--muted);font-size:15px}
.navbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1}
.todaybtn{border:0;background:none;color:var(--blue);font-weight:600;padding:2px 6px;font-size:15px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px 0 14px}
.plate{border:0;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.disc{width:44px;height:44px;border-radius:50%;position:relative;display:block;
  background:var(--line);
  background:conic-gradient(var(--c) calc(var(--p) * 1turn), color-mix(in srgb, var(--c) 24%, var(--surface)) 0)}
.disc::after{content:"";position:absolute;inset:16px;border-radius:50%;background:var(--paper)}
.is-rest .disc{width:14px;height:14px;margin:15px;background:var(--line)}
.is-rest .disc::after{display:none}
.plate.is-sel .disc{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.wd{font-size:13px;color:var(--muted);font-weight:500}
.is-today .wd{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.tab{border:0;background:none;border-radius:9px;padding:10px 0;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}

.dayhead{border-left:6px solid var(--c);padding:2px 0 2px 12px;margin-bottom:14px}
.dayhead h2{font-size:30px;font-weight:700}
.dayhead p{margin:4px 0 0;color:var(--muted)}
.swap{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--muted)}
.swap select{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ex header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex h3{font-size:21px;font-weight:600}
.target{color:var(--muted);font-size:15px;white-space:nowrap}
.last,.hint{margin:4px 0 8px;font-size:14px;color:var(--muted)}
.restline{margin:2px 0 0;font-size:14px;color:var(--muted)}
.howbtn{padding:6px 0 2px;font-size:15px}
.howto{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0 4px}
.bodymap{width:100%;max-width:300px;display:block;margin:0 auto 8px}
.motion{width:100%;max-width:300px;display:block;margin:0 auto 4px;background:var(--surface);border-radius:10px}
.howto .musc{margin:0 0 8px;font-size:15px}
.howto ol{margin:0 0 8px;padding-left:20px}
.howto li{margin-bottom:4px}
.howto .mistake{margin:0 0 8px;font-size:15px}
.demo{color:var(--blue);font-weight:600;text-decoration:none}
.hint{color:var(--ink);font-weight:500}
.hint::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:1px}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center;margin-top:8px}
.set.time{grid-template-columns:22px minmax(0,1fr) 44px}
.sn{color:var(--muted);font-size:14px;text-align:center}
.field{height:44px;width:100%;min-width:0;border-radius:8px;border:1px solid var(--line);background:var(--field);padding:0 10px;font-size:16px}
.tick{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on)}
.set.is-done .field{color:var(--muted)}
.addset{margin-top:10px;border:0;background:none;color:var(--blue);font-weight:600;padding:4px 0}

.toggle{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.toggle .box{flex:none;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:15px;color:transparent}
.toggle[aria-pressed="true"] .box{background:var(--green);border-color:var(--green);color:#fff}
.toggle .txt{flex:1;min-width:0}
.toggle strong{display:block;font-weight:600}
.toggle small{display:block;color:var(--muted);font-size:14px}
.toggle .num{flex:none;text-align:right;font-size:14px;color:var(--muted);line-height:1.3}


.meters{display:grid;gap:14px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:30px;font-weight:700}
.of{color:var(--muted);font-size:15px}
.bar{height:10px;border-radius:5px;background:var(--field);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--ink)}
.bar.over span{background:var(--red)}
.left{font-size:14px;color:var(--muted);margin-top:4px}

.qa{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.btn{height:44px;border-radius:10px;border:0;background:var(--ink);color:var(--paper);font-weight:600;padding:0 16px;margin-top:8px;width:100%}
.extra{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.extra:first-child{border-top:0}
.rm{border:0;background:none;color:var(--muted);width:36px;height:36px;font-size:20px}
.sec-title{font-size:22px;font-weight:700;margin:20px 0 10px}
.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{color:var(--muted);font-size:15px;margin:8px 0 0}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
.status{color:var(--muted);font-size:13px;text-align:center;margin-top:24px}
.tabs{grid-template-columns:repeat(5,1fr)}
.tab{font-size:15px;padding:10px 0}
.welcome{border-color:var(--blue)}
.libitem{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 0}
.libitem small{display:block;color:var(--muted);font-size:13px}
.libitem .plus{font-size:22px;color:var(--blue);font-weight:600}
.edrow{border-top:1px solid var(--line);padding:10px 0}
.edtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.edbtns{display:flex;gap:4px;flex:none}
.mini{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.mini:disabled{opacity:.35}
.edfields{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;align-items:end;margin-top:6px}
.edtoggles{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.toggle.mini-t{margin:0;padding:8px 10px;width:auto;border-radius:10px}
.toggle.mini-t .box{width:22px;height:22px}
.wkrow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center;margin-top:8px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.on small{color:inherit}
.mnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:12px}
.mnav h2{text-align:center;font-size:26px}
.histday{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 0;font-size:14px}
.histday:first-child{border-top:0}
.histday .hd{font-weight:600}
.histday .hb{color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 0;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--field);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.toggle.radio .box{border-radius:50%}
.chip-row .toggle{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:8px 12px;font-size:15px;text-align:left;line-height:1.2}
.chip small{color:var(--muted);font-size:13px;margin-left:4px}
.chip:active{background:var(--line)}
.chip-row{display:flex;align-items:center;gap:2px}
.chip-x{border:0;background:none;color:var(--muted);width:28px;height:36px;font-size:16px}
.buy{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:8px}
.price{display:grid;grid-template-columns:minmax(0,1fr) 16px minmax(0,1fr) 72px 32px;gap:6px 6px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.price:first-of-type{border-top:0}
.price .nm{grid-column:1/-1}
.price .field{padding:0 8px}
.price .x{text-align:center;color:var(--muted);font-size:14px}
.price .wk{text-align:right;font-weight:600;font-size:15px}
.price-head{display:grid;grid-template-columns:minmax(0,1fr) 16px minmax(0,1fr) 72px 32px;gap:6px;font-size:13px;color:var(--muted)}
.price-head span:nth-child(4){text-align:right}
.hist{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center;margin-top:8px;font-size:14px}
.hist .bar{margin-top:0}
.hist b{text-align:right;font-weight:600}
.planline{position:relative}
.linkbtn{border:0;background:none;color:var(--blue);font-weight:600;padding:8px 0 0}
.swr{position:relative;overflow:hidden;border-radius:12px}
.swr[data-sw="set"]{margin-top:8px;transition:transform .15s}
.swr>.set{margin-top:0}
.sw{position:relative;z-index:1;background:var(--surface);touch-action:pan-y;transition:transform .2s ease}
.sw.dragging{transition:none}
.swbg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:14px;font-weight:600;color:#fff;background:var(--line)}
.swr.r .swbg{background:var(--blue)}
.swr.l .swbg{background:var(--red)}
.swr.r .swd,.swr.l .swe,.swr:not(.l):not(.r) .swbg span{visibility:hidden}
.swbg span{transition:transform .12s}
.swr.go .swbg span{transform:scale(1.1)}
.swr.li{border-radius:0;border-top:1px solid var(--line)}
.swr.li:first-child{border-top:0}
.swr.li .extra{border-top:0}
.swr.lift{z-index:3;box-shadow:0 8px 22px rgba(0,0,0,.22);transition:none}
.grip{color:var(--muted);text-align:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:15px;letter-spacing:-3px;padding:12px 0}
.set{grid-template-columns:18px 30px minmax(0,1fr) minmax(0,1fr) 44px}
.set.time{grid-template-columns:18px 30px minmax(0,1fr) 44px}
.sn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--field);font-size:14px;font-weight:600;color:var(--muted);padding:0}
.sn.drop{background:var(--c);border-color:var(--c);color:var(--on)}
.addrow{display:flex;gap:20px}
.set.nogrip{grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 44px}
.set.nogrip.time{grid-template-columns:34px minmax(0,1fr) 44px}
.sn.small{font-size:12px;width:34px;border-radius:15px}
.ss{border-left:4px solid var(--c)}
.sslbl{margin:0 0 2px;font-weight:700;font-size:13px;letter-spacing:.02em;color:var(--c)}
.ssx{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.ssx:first-of-type{border-top:0;margin-top:0;padding-top:0}
.sstag{flex:none;width:24px;height:24px;border-radius:7px;background:var(--c);color:var(--on);font-weight:700;font-size:14px;display:grid;place-items:center}
.round{border-top:1px dashed var(--line);margin-top:10px;padding-top:2px}
.rlabel{margin:6px 0 0;font-size:13px;font-weight:600;color:var(--muted)}
.rhead{margin:12px 0 6px;font-weight:600}
.routine{padding:4px 14px}
.ritem{border-top:1px solid var(--line);padding:8px 0}
.ritem:first-child{border-top:0}
.rrow{display:flex;align-items:center;gap:12px}
.rtick{flex:none;width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:transparent;font-size:15px;padding:0}
.rtick[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.rname{flex:1;min-width:0;font-weight:600}
.rname small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.rhow{flex:none;padding:6px 0}
.motions.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.motions figure{margin:0}
.motions figcaption{text-align:center;font-size:12px;color:var(--muted)}
.fcout{font-size:15px;align-self:end;padding-bottom:10px}
.mbrow{display:grid;grid-template-columns:minmax(0,1fr) 80px 14px 32px;gap:6px;align-items:center;border-top:1px solid var(--line);padding:6px 0}
.mbrow:first-of-type{border-top:0}
details.mine{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.mine summary{cursor:pointer;color:var(--blue);font-weight:600}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.tgrid .of{display:block}
.storehead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:16px}
.storehead span{color:var(--muted);font-size:14px}
.prod{border-top:1px solid var(--line);padding:10px 0}
.prod:first-of-type{border-top:0}
.prodtop{display:flex;gap:6px;align-items:center}

.prodgrid .span2{grid-column:1/-1}
.prodcost{margin:8px 0 0;font-size:14px;color:var(--muted)}
.ex .exhead{align-items:center}
.exhead h3{flex:1;min-width:0}
.exmenu{flex:none;border:0;background:none;font-size:20px;color:var(--muted)}
.entry{border:0;background:none;padding:0;text-align:left;flex:1;min-width:0;font-size:16px}
.tip{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.tip .linkbtn{padding:0 0 0 4px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,180%);background:var(--ink);color:var(--paper);border-radius:12px;padding:8px 10px 8px 16px;display:flex;gap:12px;align-items:center;font-size:15px;z-index:50;transition:transform .2s;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.show{transform:translate(-50%,0)}
#toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:8px}
#rt{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);width:min(528px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:10px 12px;display:flex;align-items:center;gap:12px;z-index:45;transition:transform .22s}
#rt.show{transform:translate(-50%,0)}
#rt .ring{flex:none;width:58px;height:58px;position:relative;border:0;background:none;padding:0}
#rt .ring svg{width:58px;height:58px;transform:rotate(-90deg)}
#rt .ring circle{fill:none;stroke-width:6}
#rt .ring .bg{stroke:var(--line)}#rt .ring .fg{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
#rt.done .ring .fg{stroke:var(--green)}#rt.paused .ring .fg{stroke:var(--muted)}
#rt .ring span{position:absolute;inset:0;display:grid;place-items:center;font:700 17px/1 "Barlow Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums}
#rt .rtx{flex:1;min-width:0}
#rt .rtx b{display:block;font-size:15px;line-height:1.2}
#rt .rtx small{color:var(--muted);font-size:13px}
#rt .rtb{display:flex;gap:6px;flex:none}
#rt .rtb button{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--field);font-weight:700;font-size:14px;padding:0 8px}
#rt.done{border-color:var(--green)}
#toast:not(.show){visibility:hidden;transition:transform .2s,visibility 0s .2s}
body.rt-on #toast.show{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body.rt-on .wrap{padding-bottom:110px}
.restbtn{border:0;background:none;padding:4px 0;margin:2px 0 0;font-size:14px;color:var(--muted);text-align:left;display:inline-flex;align-items:center;gap:6px}
.restbtn .chip{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:999px;padding:2px 9px;font-weight:600;font-size:13px;white-space:nowrap}
.holdbtn{flex:none;border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 10px;font-weight:600;font-size:13px;min-height:36px}
.rtopts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}

let histMonth=null;
function renderHistory(){
  const t=todayKey();if(!histMonth)histMonth=t.slice(0,7);
  const [y,m]=histMonth.split("-").map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate();
  const label=first.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  const rows=[];let kcalSum=0,kcalN=0,protSum=0,workouts=0,spent=0,weights=[];
  for(let d=days;d>=1;d--){
    const k=histMonth+"-"+pad(d),day=store.days[k];if(!day)continue;
    const p=planOf(k),P=plansFor(k)[p],pr=progress(k,p),et=eatTotals(day);
    const sets=Object.values(day.sets||{}).reduce((a,r)=>a+r.filter(x=>x.d).length,0);
    const buys=(day.buys||[]).reduce((a,b)=>a+num(b.e),0),cm=(day.cardioLog||[]).reduce((a,c)=>a+(Number(c.m)||0),0);
    if(!(sets||et.k||day.steps||day.weight||buys||cm))continue;
    if(et.k){kcalSum+=et.k;protSum+=et.p;kcalN++;}if(sets)workouts++;spent+=buys;if(Number(day.weight)>0)weights.push({k,w:Number(day.weight)});
    const bits=[];
    if(sets)bits.push(`${esc(P?P.name:"Workout")}, ${sets} sets${p!=="rest"&&p!=="run"?" ("+Math.round(pr*100)+"%)":""}`);
    if(cm)bits.push(`${fmt(cm)} min cardio`);
    if(et.k)bits.push(`${fmt(et.k)} kcal, ${Math.round(et.p)} g protein`);
    if(day.steps)bits.push(`${fmt(day.steps)} steps`);
    if(Number(day.weight)>0)bits.push(`${day.weight} kg`);
    if(buys)bits.push(`${eur(buys)} spent`);
    rows.push(`<button class="histday" data-act="openday" data-day="${k}"><span class="hd">${parseKey(k).toLocaleDateString(undefined,{weekday:"short",day:"numeric"})}</span><span class="hb">${bits.join("<br>")}</span></button>`);
  }
  let h=`<section><div class="mnav"><button class="navbtn" data-act="hprev" aria-label="Previous month">‹</button><h2>${label}</h2><button class="navbtn" data-act="hnext" aria-label="Next month">›</button></div>`;
  h+=`<div class="card"><div class="pair"><div><span class="big">${workouts}</span> <span class="of">workouts</span></div><div><span class="big">${kcalN?fmt(kcalSum/kcalN):"–"}</span> <span class="of">avg kcal</span></div><div><span class="big">${kcalN?Math.round(protSum/kcalN):"–"}</span> <span class="of">avg g protein</span></div><div><span class="big">${eur(spent)}</span> <span class="of">spent</span></div></div>`;
  if(weights.length>1){weights.sort((a,b)=>a.k<b.k?-1:1);const d=weights[weights.length-1].w-weights[0].w;h+=`<p class="note">Weight: ${weights[0].w} to ${weights[weights.length-1].w} kg (${d<=0?"":"+"}${d.toFixed(1)} kg)</p>`;}
  h+=`</div>`;
  h+=rows.length?`<div class="card" style="padding:4px 14px">${rows.join("")}</div>`:`<p class="empty">Nothing logged in ${label}.</p>`;
  h+=`<p class="note">Tap a day to open it.</p></section>`;
  $("panel").innerHTML=h;
}

function loadLocal(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const o=JSON.parse(raw);Object.assign(store.days,o.days||{});Object.assign(store.settings,o.settings||{});}}catch(e){}}

function setStatus(t){$("status").textContent=t;}

function persist(docId){
  saveLocal();
  if(mode!=="db")return;
  dirty.add(docId);vers[docId]=(vers[docId]||0)+1;
  clearTimeout(timers[docId]);
  timers[docId]=setTimeout(()=>flush(docId),700);
}
async function flush(docId){
  const v=vers[docId];
  const body=docId==="settings"?store.settings:store.days[docId.slice(4)];
  try{
    await db.collection("data/users/"+uid).doc(docId).set(JSON.parse(JSON.stringify(body||{})));
    if(vers[docId]===v)dirty.delete(docId);
  }catch(e){
    if(e&&e.code==="unavailable"){timers[docId]=setTimeout(()=>flush(docId),1500+Math.random()*1500);return;}
    if(e&&e.code==="quota_exceeded"){setStatus("Your account storage is full. New entries are kept in this browser only.");}
    else setStatus("Couldn't save to your account. Entries are kept in this browser for now.");
    mode="local";dirty.clear();
  }
}

let pendingRender=false;
function scheduleRender(){
  const a=document.activeElement;
  if(a&&$("app").contains(a)&&(a.tagName==="INPUT"||a.tagName==="SELECT")){pendingRender=true;return;}
  render();
}
document.addEventListener("focusout",()=>{setTimeout(()=>{if(pendingRender){const a=document.activeElement;if(!(a&&(a.tagName==="INPUT"||a.tagName==="SELECT"))){pendingRender=false;render();}}},0);});

function subscribe(){
  db.collection("data/users/"+uid).onSnapshot(snap=>{
    for(const d of snap.docs){
      if(dirty.has(d.id))continue;
      const data=d.data();if(!data)continue;
      if(d.id==="settings")Object.assign(store.settings,JSON.parse(JSON.stringify(data)));
      else if(d.id.startsWith("day-"))store.days[d.id.slice(4)]=JSON.parse(JSON.stringify(data));
    }
    if(!migrated&&!snap.metadata.fromCache){
      migrated=true;
      const have=new Set(snap.docs.map(d=>d.id));
      for(const k of Object.keys(store.days))if(!have.has("day-"+k))persist("day-"+k);
    }
    saveLocal();scheduleRender();
  },()=>{mode="local";setStatus("Lost the connection to your account. Entries are kept in this browser for now.");});
}

// ---------- Helpers ----------
function planOf(k){const d=store.days[k],PL=plansFor(k);return (d&&d.plan&&PL[d.plan])?d.plan:weekFor(k)[parseKey(k).getDay()];}
function ensureDay(k){return store.days[k]||(store.days[k]={});}
function rowsFor(day,id,n){day.sets=day.sets||{};const a=day.sets[id]||(day.sets[id]=[]);while(a.length<n)a.push({w:"",r:"",d:false});return a;}
const nRows=e=>e[2]+(e[5]?2:0);
const exFor=(P,k)=>P.ex.filter(e=>!e[6]||k>=e[6]);
function topRep(t){const m=String(t).match(/\d+/g);return m?Number(m[m.length-1]):null;}
function progress(k,p){
  if(p==="run"){const d=store.days[k]||{};const m=(d.cardioLog||[]).reduce((a,c)=>a+(Number(c.m)||0),0);return Math.min(1,m/20);}
  const P=plansFor(k)[p];if(!P)return 0;const list=dayExercises(k,p);if(!list.length)return 0;
  const day=store.days[k]||{};let total=0,done=0;
  for(const e of list){const n=rowCount(day,e);total+=n;const r=(day.sets&&day.sets[e[0]])||[];done+=Math.min(n,r.filter(x=>x.d).length);}
  return total?Math.min(1,done/total):0;
}
function lastSession(id,k){
  const keys=Object.keys(store.days).filter(x=>x<k).sort().reverse();
  for(const x of keys){const s=store.days[x].sets&&store.days[x].sets[id];if(s&&s.some(r=>String(r.r).trim()!==""))return {key:x,rows:s.filter(r=>String(r.r).trim()!=="")};}
  return null;
}
function shortDate(k){return parseKey(k).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});}

function renderWeek(){
  const d=parseKey(sel),mon=addDays(sel,-((d.getDay()+6)%7)),t=todayKey();let h="";
  for(let i=0;i<7;i++){
    const k=addDays(mon,i),p=planOf(k),P=plansFor(k)[p],pr=progress(k,p);
    const label=parseKey(k).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})+", "+P.name+(p!=="rest"?", "+Math.round(pr*100)+"% of sets done":"");
    h+=`<button class="plate${k===sel?" is-sel":""}${p==="rest"?" is-rest":""}${k===t?" is-today":""}" data-day="${k}" style="--c:${P.color};--p:${pr}" aria-label="${esc(label)}"${k===sel?' aria-current="date"':""}><span class="disc"></span><span class="wd">${"MTWTFSS"[i]}</span></button>`;
  }

}

function lastLine(id,k,sets,target,flag,v2){
  const last=lastSession(id,k),top=topRep(target);
  if(last&&top&&!flag&&last.rows.length>=sets&&last.rows.slice(0,sets).every(r=>Number(r.r)>=top))return `<p class="hint">You hit ${top} reps on every set last time. Add a little weight today.</p>`;
  if(!last&&v2&&START[id])return `<p class="last">Suggested first time: ${START[id]}, leaving 2–3 reps in the tank.</p>`;
  if(last)return `<p class="last">Last time (${shortDate(last.key)}): ${last.rows.map(r=>flag==="time"?esc(r.r)+" s":(String(r.w).trim()?(flag==="bw"?"+":"")+esc(r.w)+" kg × ":(flag==="bw"?"BW × ":""))+esc(r.r)).join(", ")}</p>`;
  return "";
}

function rowsInfo(day,e){const id=e[0],rws=(day.sets&&day.sets[id])||[],rc=rowCount(day,e),types=[];for(let i=0;i<rc;i++)types.push(rowType(e,rws[i],i));return {rws,rc,types};}

function supersetCard(group,ctx){

function hiddenMeals(){return Array.isArray(store.settings.hideMeals)?store.settings.hideMeals:[];}
function myMeals(){return Array.isArray(store.settings.myMeals)?store.settings.myMeals:[];}
function slotOpts(slot){
  const hid=hiddenMeals();

  for(const mm of myMeals())if(mm.slot===slot.id)os.push({id:"m:"+mm.id,n:mm.n,d:mm.d||"Your meal",k:Number(mm.k)||0,p:Number(mm.p)||0,mine:1});

  return os;

function chosen(slot,day){const v=(day.meals||{})[slot.id];if(!v)return null;const os=slotOpts(slot);if(v===true)return os[0];return os.find(o=>o.id===v)||null;}
function eatTotals(day){

}

function weekAvg(monKey){
  const v=[];for(let i=0;i<7;i++){const d=store.days[addDays(monKey,i)];if(d&&Number(d.weight)>0)v.push(Number(d.weight));}
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
}
function renderBody(){
  const k=sel,day=store.days[k]||{},S=store.settings;

    <label><span class="lbl">Morning weight (kg)</span><input class="field" data-body="weight" inputmode="decimal" placeholder="e.g. 84.6" value="${esc(day.weight)}"></label>
    <label><span class="lbl">Steps</span><input class="field" data-body="steps" inputmode="numeric" placeholder="7,000–10,000" value="${esc(day.steps)}"></label></div>
    <p class="note">Weigh in after the bathroom, before eating. Watch the weekly average, not single days.</p></div>`;
  h+=`<h2 class="sec-title">Weekly trend</h2><div class="card">`;

      else if(diff<=-0.3)g="Right on pace for your target.";

      else g="Up this week. Water, salt and creatine can all do this, so give it another week before changing anything.";
      h+=`<p class="note" style="color:var(--ink)">${g}</p>`;
    }

function chart(endKey){
  const pts=[];for(let i=41;i>=0;i--){const k=addDays(endKey,-i),d=store.days[k];if(d&&Number(d.weight)>0)pts.push({i:41-i,w:Number(d.weight)});}
  if(pts.length<2)return `<p class="empty">Log your morning weight on a few days to see your trend here.</p>`;
  const W=320,H=140,px=10,py=14;
  let lo=Math.min(...pts.map(p=>p.w)),hi=Math.max(...pts.map(p=>p.w));if(hi-lo<1){lo-=.5;hi+=.5;}
  const x=i=>px+i*(W-2*px)/41,y=w=>py+(hi-w)*(H-2*py)/(hi-lo);
  const avg=pts.map(p=>{const win=pts.filter(q=>q.i<=p.i&&q.i>p.i-7);return {i:p.i,w:win.reduce((a,b)=>a+b.w,0)/win.length};});
  const line=avg.map((p,j)=>(j?"L":"M")+x(p.i).toFixed(1)+" "+y(p.w).toFixed(1)).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H+16}" role="img" aria-label="Weight over the last six weeks, from ${pts[0].w} to ${pts[pts.length-1].w} kg">
    <text x="0" y="${py-3}" font-size="11" fill="var(--muted)">${hi.toFixed(1)}</text>
    <text x="0" y="${H-py+12}" font-size="11" fill="var(--muted)">${lo.toFixed(1)}</text>
    ${pts.map(p=>`<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.w).toFixed(1)}" r="2.6" fill="var(--muted)" opacity=".55"/>`).join("")}
    <path d="${line}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="${W}" y="${H+14}" font-size="11" fill="var(--muted)" text-anchor="end">Dots: daily. Line: 7-day average</text>
  </svg>`;
}

function ensureQuick(){if(!Array.isArray(store.settings.quick))store.settings.quick=JSON.parse(JSON.stringify(DEFAULT_QUICK));return store.settings.quick;}
function recipes(){return Array.isArray(store.settings.recipes)?store.settings.recipes:[];}
function ensureRecipes(){if(!Array.isArray(store.settings.recipes))store.settings.recipes=[];return store.settings.recipes;}
function supps(){return Array.isArray(store.settings.supps)?store.settings.supps:DEFAULT_SUPPS;}
function ensureSupps(){if(!Array.isArray(store.settings.supps))store.settings.supps=DEFAULT_SUPPS.slice();return store.settings.supps;}
function prices(){return Array.isArray(store.settings.prices)?store.settings.prices:DEFAULT_PRICES;}
function ensurePrices(){if(!Array.isArray(store.settings.prices))store.settings.prices=JSON.parse(JSON.stringify(DEFAULT_PRICES));return store.settings.prices;}
function chick(){return Object.assign({},DEFAULT_CHICKEN,store.settings.chicken||{});}
function ensureChicken(){store.settings.chicken=chick();return store.settings.chicken;}
const eur=n=>"€"+(Math.round(n*100)/100).toFixed(2).replace(".",",");
const num=v=>Number(String(v).replace(",","."))||0;
function othersWk(){return prices().reduce((a,p)=>a+num(p.e)*num(p.q),0);}
function chickenWk(){const c=chick(),kgWk=num(c.g)*7/1000;return c.bulk?(num(c.packKg)?kgWk/num(c.packKg)*num(c.packEur):0):kgWk*num(c.kg);}
function packDays(){const c=chick();return num(c.g)?num(c.packKg)*1000/num(c.g):0;}
const ANCHOR="2026-09-28";
function dayDiff(a,b){return Math.round((parseKey(b)-parseKey(a))/86400000);}
function periodStart(k,view){const d=parseKey(k),mon=addDays(k,-((d.getDay()+6)%7));if(view==="week")return mon;const n=Math.floor(dayDiff(ANCHOR,mon)/14);return addDays(ANCHOR,n*14);}
function spendFrom(start,len){let t=0;for(let i=0;i<len;i++){const d=store.days[addDays(start,i)];for(const b of (d&&d.buys)||[])t+=num(b.e);}return t;}
function guessStore(n){return "Supermarket";}
function products(){
  const S=store.settings;if(Array.isArray(S.products))return S.products;
  const out=prices().map((p,i)=>({id:"p"+i,n:String(p.n).replace(/\s*\(Naanhof\)/,""),store:guessStore(p.n),price:num(p.e),mode:"packs",q:num(p.q)}));
  const c=chick();out.push({id:"pc",n:"Chicken, "+c.packKg+" kg pack",store:"Supermarket",price:num(c.packEur),mode:"grams",packG:num(c.packKg)*1000,gpd:num(c.g)});
  return out;
}
function ensureProducts(){const S=store.settings;if(!Array.isArray(S.products))S.products=JSON.parse(JSON.stringify(products()));return S.products;}
function prodWeekly(pr){const price=num(pr.price);if(pr.mode==="days")return num(pr.days)>0?price*7/num(pr.days):0;if(pr.mode==="grams")return num(pr.packG)>0?price*num(pr.gpd)*7/num(pr.packG):0;return price*num(pr.q);}
function prodDays(pr){if(pr.mode==="days")return num(pr.days);if(pr.mode==="grams")return num(pr.gpd)>0?num(pr.packG)/num(pr.gpd):0;return num(pr.q)>0?7/num(pr.q):0;}
function storeOf(b){return b.s||(String(b.n||"").includes(":")?String(b.n).split(":")[0].trim():"Other");}
function storesList(){const set=[];for(const pr of products())if(pr.store&&!set.includes(pr.store))set.push(pr.store);for(const dk of Object.keys(store.days))for(const b of store.days[dk].buys||[]){const s=storeOf(b);if(s!=="Other"&&!set.includes(s))set.push(s);}return set;}
function spendView(){const v=store.settings.spendView;return v==="fortnight"||v==="month"?v:"week";}
function periodOf(k,view){
  if(view==="month"){const d=parseKey(k),start=keyOf(new Date(d.getFullYear(),d.getMonth(),1)),len=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return {start,len};}
  return {start:periodStart(k,view),len:view==="week"?7:14};
}
let spStore="";
function prodCard(pr){
  const wk=prodWeekly(pr),d=prodDays(pr);
  return `<div class="prod" data-pid="${pr.id}"><div class="prodtop"><input class="field" data-pp="n" value="${esc(pr.n)}" aria-label="Product name"><button class="rm" data-act="rmprod" data-id="${pr.id}" aria-label="Remove ${esc(pr.n)}">×</button></div>
    <div class="prodgrid"><label><span class="lbl">Price €</span><input class="field" data-pp="price" inputmode="decimal" value="${esc(pr.price)}"></label>
    <label><span class="lbl">Store</span><input class="field" data-pp="store" list="storeList" value="${esc(pr.store||"")}"></label>
    <label class="span2"><span class="lbl">How you use it</span><select class="field" data-pp="mode"><option value="days"${pr.mode==="days"?" selected":""}>Lasts a number of days</option><option value="grams"${pr.mode==="grams"?" selected":""}>Pack size and grams per day</option><option value="packs"${pr.mode==="packs"?" selected":""}>Packs per week</option></select></label>
    ${pr.mode==="days"?`<label><span class="lbl">Lasts (days)</span><input class="field" data-pp="days" inputmode="decimal" value="${esc(pr.days||"")}"></label>`:pr.mode==="grams"?`<label><span class="lbl">Pack size (g)</span><input class="field" data-pp="packG" inputmode="decimal" value="${esc(pr.packG||"")}"></label><label><span class="lbl">Grams per day</span><input class="field" data-pp="gpd" inputmode="decimal" value="${esc(pr.gpd||"")}"></label>`:`<label><span class="lbl">Packs per week</span><input class="field" data-pp="q" inputmode="decimal" value="${esc(pr.q||"")}"></label>`}</div>
    <p class="prodcost" data-pc="${pr.id}">${prodCostText(pr)}</p></div>`;
}
function prodCostText(pr){const wk=prodWeekly(pr),d=prodDays(pr);return `${eur(wk)} a week${d?`, one lasts about ${d>=10?Math.round(d):r1(d)} days`:""}`;}
function renderSpend(){
  const view=spendView(),k=sel,{start,len}=periodOf(k,view),end=addDays(start,len-1);
  const PR=products(),mult=view==="week"?1:view==="fortnight"?2:len/7;
  const plan=PR.reduce((a,pr)=>a+prodWeekly(pr),0)*mult,spent=spendFrom(start,len);
  const pct=plan?Math.min(100,spent/plan*100):0,over=spent>plan;
  const dfmt=x=>parseKey(x).toLocaleDateString(undefined,{day:"numeric",month:"short"});
  const label=view==="week"?"this week":view==="fortnight"?"these 2 weeks":"this month";
  const stores=storesList();if(!spStore||!stores.includes(spStore))spStore=stores[0]||"";
  let h=`<datalist id="storeList">${stores.map(s=>`<option value="${esc(s)}">`).join("")}</datalist><section><div class="seg seg3" role="group" aria-label="Budget period"><button data-act="view" data-v="week" aria-pressed="${view==="week"}">Weekly</button><button data-act="view" data-v="fortnight" aria-pressed="${view==="fortnight"}">2 weeks</button><button data-act="view" data-v="month" aria-pressed="${view==="month"}">Monthly</button></div>`;
  h+=`<div class="card"><div><span class="big">${eur(spent)}</span> <span class="of">spent ${label}, ${dfmt(start)} to ${dfmt(end)}</span></div>
    <div class="bar${over?" over":""}"><span style="width:${pct}%"></span></div>
    <div class="left">${over?eur(spent-plan)+" over":eur(plan-spent)+" left"} of the planned ${eur(plan)}</div></div>`;
  // log purchase
  h+=`<h2 class="sec-title">Log a purchase</h2><div class="card">`;
  if(stores.length){
    h+=`<p class="lbl">Store</p><div class="chips">${stores.map(s=>`<button class="chip${s===spStore?" on":""}" data-act="spstore" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>`;
    const inStore=PR.filter(pr=>(pr.store||"")===spStore);
    if(inStore.length)h+=`<p class="lbl">Tap what you bought</p><div class="chips">${inStore.map(pr=>`<button class="chip" data-act="logprod" data-id="${pr.id}">${esc(pr.n)}<small>${eur(num(pr.price))}</small></button>`).join("")}</div>`;
  }
  h+=`<p class="lbl">Or type the receipt total or an item</p><div class="buy"><input class="field" id="buyN" placeholder="What (optional)" aria-label="What you bought"><input class="field" id="buyE" inputmode="decimal" placeholder="€" aria-label="Amount in euros"></div>
    <input class="field" id="buyS" list="storeList" placeholder="Store" value="${esc(spStore)}" aria-label="Store" style="margin-top:8px">
    <button class="btn" data-act="addbuy">Add to ${esc(shortDate(k))}</button></div>`;
  // shopping grouped by store
  h+=`<h2 class="sec-title">Shopping ${label}</h2>`;
  const rows=[];for(let i=0;i<len;i++){const dk=addDays(start,i),dd=store.days[dk];((dd&&dd.buys)||[]).forEach((b,j)=>rows.push({dk,j,b}));}
  if(!rows.length)h+=`<div class="card"><p class="note" style="margin:0">Nothing logged ${label} yet.</p></div>`;
  else{const by={};for(const r of rows){const s=storeOf(r.b);(by[s]=by[s]||[]).push(r);}
    for(const [s,list] of Object.entries(by)){const sub=list.reduce((a,r)=>a+num(r.b.e),0);
      h+=`<div class="card"><div class="storehead"><b>${esc(s)}</b><span>${eur(sub)}</span></div>`+list.map(r=>`<div class="swr li" data-sw="buy" data-day="${r.dk}" data-i="${r.j}">${swbg("Edit","Delete")}<div class="sw extra"><button class="entry" data-act="editentry">${esc(String(r.b.n||"Groceries").replace(/^[^:]+:\s*/,""))}<br><small class="of">${shortDate(r.dk)}</small></button><span style="display:flex;align-items:center;gap:6px"><b>${eur(num(r.b.e))}</b><button class="rm" data-act="rmbuy" data-day="${r.dk}" data-i="${r.j}" aria-label="Remove">×</button></span></div></div>`).join("")+`</div>`;}}
  // planned products grouped by store
  h+=`<h2 class="sec-title">Planned costs</h2><p class="note" style="margin:-4px 0 10px">Add what you buy regularly and how long it lasts. The tracker works out the cost per week, per 2 weeks and per month.</p>`;
  const groups={};for(const pr of PR){const s=pr.store||"No store";(groups[s]=groups[s]||[]).push(pr);}
  for(const [s,list] of Object.entries(groups)){const sub=list.reduce((a,pr)=>a+prodWeekly(pr),0)*mult;
    h+=`<div class="card"><div class="storehead"><b>${esc(s)}</b><span>${eur(sub)} ${view==="week"?"a week":view==="fortnight"?"per 2 weeks":"a month"}</span></div>${list.map(prodCard).join("")}</div>`;}
  h+=`<button class="btn ghost" data-act="addprod">Add a product</button>`;
  // history
  h+=`<h2 class="sec-title">${view==="week"?"Recent weeks":view==="fortnight"?"Recent 2-week periods":"Recent months"}</h2><div class="card">`;
  const ps=[];
  if(view==="month"){const d=parseKey(k);for(let m=5;m>=0;m--){const s0=keyOf(new Date(d.getFullYear(),d.getMonth()-m,1)),dd=parseKey(s0),l=new Date(dd.getFullYear(),dd.getMonth()+1,0).getDate();ps.push({s:s0,t:spendFrom(s0,l),lbl:dd.toLocaleDateString(undefined,{month:"short"})});}}
  else for(let w=5;w>=0;w--){const s0=addDays(start,-len*w);ps.push({s:s0,t:spendFrom(s0,len),lbl:dfmt(s0)});}
  const mx=Math.max(plan,...ps.map(w=>w.t),1);
  h+=ps.map(w=>`<div class="hist"><span class="of">${w.lbl}</span><div class="bar${w.t>plan?" over":""}"><span style="width:${w.t/mx*100}%"></span></div><b>${w.t?eur(w.t):"–"}</b></div>`).join("");
  const logged=ps.filter(w=>w.t>0);
  if(logged.length>1)h+=`<p class="note">Average over logged periods: ${eur(logged.reduce((a,w)=>a+w.t,0)/logged.length)}</p>`;
  h+=`</div></section>`;
  $("panel").innerHTML=h;
}

$("prev").onclick=()=>{sel=addDays(sel,-1);render();};
$("next").onclick=()=>{sel=addDays(sel,1);render();};
$("week").onclick=e=>{const b=e.target.closest("[data-day]");if(b){sel=b.dataset.day;render();}};
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;render();}};
$("dSub").onclick=e=>{if(e.target.closest('[data-act="today"]')){sel=todayKey();render();}};

$("panel").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,k=sel,docId="day-"+k;
  if(act==="tick"||act==="addset"||act==="adddrop"||act==="settype"){
    const exEl=b.closest("[data-ex]"),id=exEl.dataset.ex,ex=exLookup(k,id);
    const day=ensureDay(k);
    if(act==="tick"){const i=+b.dataset.i,rows=rowsFor(day,id,Math.max(rowCount(day,ex),i+1));rows[i].d=!rows[i].d;b.setAttribute("aria-pressed",String(rows[i].d));b.closest(".set").classList.toggle("is-done",rows[i].d);persist(docId);renderWeek();if(rows[i].d)afterTick(k,id,i,b);}
    else if(act==="settype"){const rows=materialize(day,ex),i=+b.dataset.i;if(!rows[i])return;rows[i].t=rows[i].t==="d"?"n":"d";persist(docId);renderTrain();}
    else{const rows=materialize(day,ex);rows.push({w:"",r:"",d:false,t:act==="adddrop"?"d":"n"});persist(docId);render();}
  }else if(act==="gymwalk"||act==="addcardio"){
    let t="Walk to and from the gym",m=Number(store.settings.gymWalk)||48;
    if(act==="addcardio"){t=$("cT").value;m=Number($("cM").value);if(!(m>0)){$("cM").focus();return;}}
    const day=ensureDay(k);(day.cardioLog=day.cardioLog||[]).push({t,m:Math.round(m)});persist(docId);render();
  }else if(act==="easyrun"){const day=ensureDay(k);(day.cardioLog=day.cardioLog||[]).push({t:"Easy run",m:25});persist(docId);render();
  }else if(act==="restpick"){openRestPick(b.dataset.id,k);
  }else if(act==="hold"){rtAudioUnlock();rtStart(holdSecs(sinfo(b.dataset.n).hold),b.dataset.n,"Hold, breathe slowly","hold");
  }else if(act==="howto"){const id=b.closest("[data-ex]").dataset.ex;if(openHow.has(id))openHow.delete(id);else openHow.add(id);renderTrain();
  }else if(act==="warm"){const day=ensureDay(k),i=+b.dataset.i;day.warm=day.warm||{};day.warm[i]=!day.warm[i];if(!day.warm[i])delete day.warm[i];persist(docId);b.setAttribute("aria-pressed",String(!!day.warm[i]));
  }else if(act==="stretch"){const day=ensureDay(k),i=+b.dataset.i;day.stretch=day.stretch||{};day.stretch[i]=!day.stretch[i];if(!day.stretch[i])delete day.stretch[i];persist(docId);b.setAttribute("aria-pressed",String(!!day.stretch[i]));
  }else if(act==="rmcardio"){const day=ensureDay(k);(day.cardioLog||[]).splice(+b.dataset.i,1);persist(docId);renderTrain();}
  else if(act==="pick"){const day=ensureDay(k);day.meals=day.meals||{};const sl=SLOTS.find(x=>x.id===b.dataset.slot),cur=chosen(sl,day);if(cur&&cur.id===b.dataset.opt)delete day.meals[sl.id];else day.meals[sl.id]=b.dataset.opt;persist(docId);renderEat();}
  else if(act==="rice"){const day=ensureDay(k);day.meals=day.meals||{};day.meals.rice=!day.meals.rice;if(!day.meals.rice)delete day.meals.rice;persist(docId);renderEat();}
  else if(act==="supp"){const day=ensureDay(k),n=supps()[+b.dataset.i];day.supps=day.supps||{};day.supps[n]=!day.supps[n];if(!day.supps[n])delete day.supps[n];persist(docId);renderEat();}
  else if(act==="rmsupp"){ensureSupps().splice(+b.dataset.i,1);persist("settings");renderEat();}
  else if(act==="addrecipe"){
    const n=$("rN").value.trim(),kc=num($("rK").value),pr=num($("rP").value),sv=Math.round(num($("rS").value))||1;
    if(!n){$("rN").focus();return;} if(!(kc>0)){$("rK").focus();return;}
    ensureRecipes().push({id:Date.now().toString(36),n,k:kc,p:pr,s:sv});persist("settings");renderEat();
  }else if(act==="rmrecipe"){ensureRecipes().splice(+b.dataset.i,1);persist("settings");renderEat();}
  else if(act==="view"){store.settings.spendView=b.dataset.v;persist("settings");renderSpend();}
  else if(act==="bulk"){const c=ensureChicken();c.bulk=!c.bulk;persist("settings");renderSpend();}
  else if(act==="buychicken"){const day=ensureDay(k);(day.buys=day.buys||[]).push({n:"Chicken, "+chick().packKg+" kg pack",e:num(chick().packEur)});persist(docId);renderSpend();}
  else if(act==="addfood"){
    const n=$("qaN").value.trim(),kc=Number($("qaK").value),pr=Number($("qaP").value)||0;
    if(!(kc>0)){$("qaK").focus();return;}
    const day=ensureDay(k);(day.extras=day.extras||[]).push({n:n||"Food",k:kc,p:pr});persist(docId);
    if(b.dataset.save&&n){ensureQuick().push({n,k:kc,p:pr});persist("settings");}
    renderEat();
  }else if(act==="quick"){const q=quick()[+b.dataset.i];if(q){const day=ensureDay(k);(day.extras=day.extras||[]).push({n:q.n,k:q.k,p:q.p});persist(docId);renderEat();}
  }else if(act==="rmquick"){ensureQuick().splice(+b.dataset.i,1);persist("settings");renderEat();
  }else if(act==="rmfood"){const day=ensureDay(k);day.extras.splice(+b.dataset.i,1);persist(docId);renderEat();}
  else if(act==="addbuy"){
    const n=$("buyN").value.trim(),v=Number($("buyE").value.replace(",","."));
    if(!(v>0)){$("buyE").focus();return;}
    const st=($("buyS")&&$("buyS").value.trim())||"",u=snap([docId]);const day=ensureDay(k);(day.buys=day.buys||[]).push({n:n||(st?st+" shop":"Groceries"),e:Math.round(v*100)/100,s:st||undefined});if(st)spStore=st;persist(docId);renderSpend();toast("Purchase added",u);
  }else if(act==="rmbuy"){const dk=b.dataset.day,day=ensureDay(dk);(day.buys||[]).splice(+b.dataset.i,1);persist("day-"+dk);renderSpend();}
  else if(act==="addprice"){ensurePrices().push({n:"New item",e:0,q:1});persist("settings");renderSpend();}
  else if(act==="rmprice"){ensurePrices().splice(+b.dataset.i,1);persist("settings");renderSpend();}
});
$("panel").addEventListener("input",e=>{
  const t=e.target,k=sel,docId="day-"+k;
  if(t.dataset.f){
    const id=t.closest("[data-ex]").dataset.ex,ex=exLookup(k,id),i=+t.dataset.i;
    const day=ensureDay(k),rows=rowsFor(day,id,Math.max(rowCount(day,ex),i+1));rows[i][t.dataset.f]=t.value.trim();persist(docId);
  }else if(t.dataset.body){
    const day=ensureDay(k),v=t.value.replace(",",".").trim();day[t.dataset.body]=v===""?"":(Number(v)>0?Number(v):day[t.dataset.body]);persist(docId);
  }else if(t.dataset.price!==undefined){
    const ps=ensurePrices(),i=+t.dataset.price,f=t.dataset.pf;
    if(f==="n")ps[i].n=t.value;else if(t.value.trim()!==""&&num(t.value)>=0)ps[i][f]=num(t.value);
    persist("settings");
    const wk=document.querySelector(`[data-wk="${i}"]`);if(wk)wk.textContent=eur(num(ps[i].e)*num(ps[i].q)*(spendView()==="week"?1:2));
  }else if(t.dataset.ch){
    if(t.value.trim()!==""&&num(t.value)>0){ensureChicken()[t.dataset.ch]=num(t.value);persist("settings");}
  }else if(t.dataset.set){
    const v=Number(t.value);if(v>0){store.settings[t.dataset.set]=v;persist("settings");}
  }
});
$("panel").addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.act==="plan"){const day=ensureDay(sel);if(t.value===weekFor(sel)[parseKey(sel).getDay()])delete day.plan;else day.plan=t.value;persist("day-"+sel);render();}
  else if(t.dataset.body){renderBody();}
  else if(t.dataset.price!==undefined||t.dataset.ch){renderSpend();}
});

// ---------- Plan editor, meals, history ----------
function curPlanEdit(){const p=planOf(sel);return {p,P:ensureEditable(p)};}
$("panel").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,i=+b.dataset.i;
  const S=store.settings;
  if(act==="editplan"){editPlan=true;libQ="";libG="";renderTrain();window.scrollTo(0,0);}
  else if(act==="editdone"){editPlan=false;render();}
  else if(act==="exup"||act==="exdown"){const {P}=curPlanEdit(),j=act==="exup"?i-1:i+1;if(j<0||j>=P.ex.length)return;[P.ex[i],P.ex[j]]=[P.ex[j],P.ex[i]];persist("settings");renderTrain();}
  else if(act==="exdel"){const {P}=curPlanEdit();P.ex.splice(i,1);persist("settings");renderTrain();}
  else if(act==="exdrop"){const {P}=curPlanEdit();P.ex[i][5]=P.ex[i][5]?0:1;persist("settings");renderTrain();}
  else if(act==="exss"){const {P}=curPlanEdit(),a=P.ex[i],b=P.ex[i+1];if(!b)return;
    const fix=x=>{if(x.length<8){x[5]=x[5]||0;x[6]=x[6]===undefined?null:x[6];}};fix(a);fix(b);
    if(a[7]&&a[7]===b[7]){b[7]=null;for(let m=i+2;m<P.ex.length&&P.ex[m][7]===a[7];m++)P.ex[m][7]=null;if(!(i>0&&P.ex[i-1][7]===a[7]))a[7]=null;}
    else{const key=a[7]||b[7]||("g"+Date.now().toString(36));a[7]=key;b[7]=key;}
    persist("settings");renderTrain();}
  else if(act==="addex"){const {P}=curPlanEdit(),a=libArr(b.dataset.id);if(P.ex.some(x=>x[0]===a[0]))return;P.ex.push(a);persist("settings");renderTrain();}
  else if(act==="addcustomex"){
    const n=$("cxN").value.trim();if(!n){$("cxN").focus();return;}
    const id="x"+Date.now().toString(36),sets=Math.max(1,Math.round(num($("cxS").value))||3),r=$("cxR").value.trim()||"8–12";
    S.customLib=S.customLib||{};S.customLib[id]={n,sets,t:r};LIB[id]={id,n,sets,t:r,f:"",d:0,g:"Other",m:[],s:[]};
    curPlanEdit().P.ex.push([id,n,sets,r,""]);persist("settings");renderTrain();
  }
  else if(act==="libg"){libG=b.dataset.g;renderTrain();}

function calcTargets(pf){
  const w=num(pf.w),h=num(pf.h),a=num(pf.a),bf=num(pf.bf),act=num(pf.act)||1.55,goal=num(pf.goal);
  if(!(w>0&&h>0&&a>0))return null;

  const bmr=lbm?370+21.6*lbm:10*w+6.25*h-5*a+(pf.sex==="f"?-161:5);
  const tdee=bmr*act,floor=pf.sex==="f"?1200:1500;

  const prot=lbm?2.4*lbm:(goal<0?2.0:1.8)*w;
  const fat=Math.max(0.8*w,kc*0.25/9);
  const carbs=Math.max(0,(kc-prot*4-fat*9)/4);

function origOf(day,id){const sw=day.swap||{};return Object.keys(sw).find(o=>sw[o]===id)||id;}

function editEx(id){
  const k=sel,p=planOf(k),P=plansFor(k)[p],day=ensureDay(k);

  if(!cur){openSheet("Exercise",`<p class="note" style="margin-top:0">This exercise was logged earlier but is no longer in today's workout.</p>`,[{label:"Close",cls:"btn ghost"}]);return;}
  const orig=origOf(day,id),canPlan=k>=NEWPLAN;

    `<p class="note" style="margin-top:0">Pick an exercise to do instead. Sets and reps stay the same, and anything you've logged moves over.</p>

    [{label:"Swap exercise",fn:()=>{const n=sheetEl._pick;if(!n)return false;

        if(day.sets&&day.sets[id]&&!day.sets[n]){day.sets[n]=day.sets[id];delete day.sets[id];}

        day.swap=day.swap||{};
        if(scope==="plan"){const PE=ensureEditable(p);const ix=PE?PE.ex.findIndex(x=>x[0]===orig):-1;if(ix>=0){const o=PE.ex[ix],L0=libArr(n);PE.ex[ix]=[L0[0],L0[1],o[2],o[3],L0[4],o[5],o[6],o[7]];}delete day.swap[orig];persist("settings");}

// swipe engine
let swS=null,swipedAt=0,swipedEl=null;
document.addEventListener("pointerdown",e=>{
  if(e.button>0)return;
  const g=e.target.closest(".grip");if(g){startGrip(g,e);return;}
  const fg=e.target.closest(".sw");if(!fg||!fg.parentElement.classList.contains("swr"))return;
  swS={fg,wr:fg.parentElement,x:e.clientX,y:e.clientY,dx:0,active:false,id:e.pointerId};
});
document.addEventListener("pointermove",e=>{
  if(gS){moveGrip(e);return;}
  if(!swS||e.pointerId!==swS.id)return;
  const dx=e.clientX-swS.x,dy=e.clientY-swS.y;
  if(!swS.active){
    if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.4){swS.active=true;swS.fg.classList.add("dragging");try{swS.fg.setPointerCapture(e.pointerId);}catch(_){}}
    else if(Math.abs(dy)>12){swS=null;return;}
    else return;
  }
  swS.dx=Math.max(-150,Math.min(150,dx));
  swS.fg.style.transform=`translateX(${swS.dx}px)`;
  swS.wr.classList.toggle("l",swS.dx<0);swS.wr.classList.toggle("r",swS.dx>0);swS.wr.classList.toggle("go",Math.abs(swS.dx)>80);
});
function endSwipe(e){
  if(gS){endGrip(e);return;}
  if(!swS||e.pointerId!==swS.id)return;
  const s=swS;swS=null;if(!s.active)return;
  swipedAt=Date.now();swipedEl=s.wr;s.fg.classList.remove("dragging");
  const reset=()=>{s.fg.style.transform="";s.wr.classList.remove("l","r","go");};
  if(s.dx<-80){s.fg.style.transform="translateX(-110%)";setTimeout(()=>doDelete(s.wr),180);}
  else if(s.dx>80){reset();doEdit(s.wr);}
  else reset();
}
document.addEventListener("pointerup",endSwipe);
document.addEventListener("pointercancel",e=>{if(gS){endGrip(e,true);return;}if(swS&&swS.active){swS.fg.classList.remove("dragging");swS.fg.style.transform="";swS.wr.classList.remove("l","r","go");}swS=null;});
document.addEventListener("click",e=>{if(swipedEl&&Date.now()-swipedAt<350&&swipedEl.contains(e.target)){e.stopPropagation();e.preventDefault();}},true);
// drag to reorder sets
let gS=null;
function startGrip(g,e){
  const wr=g.closest(".swr"),art=wr.closest("[data-ex]");
  const els=[...art.querySelectorAll('.swr[data-sw="set"]')];
  gS={wr,art,els,i:els.indexOf(wr),j:els.indexOf(wr),y:e.clientY,h:wr.offsetHeight+8,id:e.pointerId};
  try{g.setPointerCapture(e.pointerId);}catch(_){}
  wr.classList.add("lift");e.preventDefault();
}
function moveGrip(e){
  if(e.pointerId!==gS.id)return;
  const dy=e.clientY-gS.y,{i,h,els}=gS;
  const j=Math.max(0,Math.min(els.length-1,i+Math.round(dy/h)));gS.j=j;
  gS.wr.style.transform=`translateY(${dy}px)`;
  els.forEach((el,m)=>{if(m===i)return;let t=0;if(i<j&&m>i&&m<=j)t=-h;else if(j<i&&m>=j&&m<i)t=h;el.style.transform=t?`translateY(${t}px)`:"";});
}
function endGrip(e,cancel){
  if(e.pointerId!==gS.id)return;
  const s=gS;gS=null;s.els.forEach(el=>el.style.transform="");s.wr.classList.remove("lift");
  if(cancel||s.j===s.i)return;
  const id=s.art.dataset.ex,k=sel,ex=exLookup(k,id),day=ensureDay(k),u=snap(["day-"+k]);
  const rows=materialize(day,ex);const [r]=rows.splice(s.i,1);rows.splice(s.j,0,r);
  persist("day-"+k);renderTrain();toast("Set moved",u);
}

// ---------- Appearance settings ----------
const BGS=[["default","Default","#EEF1F0","#12171D"],["white","White","#FFFFFF","#0D1015"],["warm","Warm","#F3EEE6","#18140F"],["cool","Cool","#E8EEF7","#0F1520"],["mint","Mint","#E6F2EC","#0E1914"],["lilac","Lilac","#EEEBF6","#15131D"]];
const ACCENTS=[["#2457D6","Blue"],["#6B4CE0","Purple"],["#0F8B8D","Teal"],["#D9622B","Orange"],["#C7377A","Pink"],["#1E8E52","Green"]];
function themeCfg(){return store.settings.theme||{};}
function ensureTheme(){return store.settings.theme||(store.settings.theme={});}
const darkMQ=window.matchMedia?matchMedia("(prefers-color-scheme: dark)"):null;
function isDark(){const m=themeCfg().mode;return m==="dark"||(m!=="light"&&!!(darkMQ&&darkMQ.matches));}
function applyTheme(){
  const T=themeCfg(),root=document.documentElement,dark=isDark();
  if(T.mode==="light"||T.mode==="dark")root.dataset.theme=T.mode;else delete root.dataset.theme;
  const bg=BGS.find(b=>b[0]===T.bg);
  if(bg&&bg[0]!=="default")root.style.setProperty("--paper",bg[dark?3:2]);else root.style.removeProperty("--paper");
  if(T.accent)root.style.setProperty("--blue",dark?`color-mix(in srgb, ${T.accent} 70%, white)`:T.accent);else root.style.removeProperty("--blue");
}
if(darkMQ&&darkMQ.addEventListener)darkMQ.addEventListener("change",()=>{applyTheme();render();});
function cssHex(v){const m=/^var\((--[\w-]+)\)$/.exec(String(v||"").trim());const x=m?getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim():String(v||"");return /^#[0-9a-f]{6}$/i.test(x)?x:"#888888";}
function onFor(hex){const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;const L=[r,g,b].map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));const lum=.2126*L[0]+.7152*L[1]+.0722*L[2];return lum>.45?"#18222E":"#FFFFFF";}
function withColors(PL){
  const D=themeCfg().days||{};if(!Object.keys(D).length)return PL;

function rtBeep(inSec){
  rtUnbeep();if(!actx||tcfg().sound===false)return;
  try{const t0=actx.currentTime+Math.max(0,inSec);
    [0,.28,.56].forEach((d,j)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=j===2?1320:880;
      g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(.35,t0+d+.02);g.gain.linearRampToValueAtTime(0,t0+d+(j===2?.4:.18));
      o.connect(g).connect(actx.destination);o.start(t0+d);o.stop(t0+d+.45);beeps.push(o);});}catch(e){}
}
async function rtWake(on){
  try{if(on&&tcfg().wake!==false&&"wakeLock" in navigator&&!wake&&document.visibilityState==="visible"){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null;});}
    else if(!on&&wake){await wake.release();wake=null;}}catch(e){wake=null;}
}
function rtLeft(){return RT?(RT.paused?RT.left:(RT.end-Date.now())/1000):0;}
function rtStart(secs,label,sub,kind){
  if(!(secs>0))return;clearTimeout(rtHide);
  RT={end:Date.now()+secs*1000,total:secs,label,sub:sub||"",kind:kind||"rest",paused:false,left:0,done:false};
  rtSave();rtBeep(secs);rtWake(true);rtLoop();rtDraw();
}
function rtAdjust(d){if(!RT||RT.done)return;if(RT.paused){RT.left=Math.max(1,RT.left+d);}else{RT.end=Math.max(Date.now()+1000,RT.end+d*1000);rtBeep(rtLeft());}RT.total=Math.max(RT.total,rtLeft());rtSave();rtDraw();}
function rtToggle(){if(!RT)return;if(RT.done){rtStop();return;}
  if(RT.paused){RT.paused=false;RT.end=Date.now()+RT.left*1000;rtBeep(RT.left);rtWake(true);}else{RT.left=rtLeft();RT.paused=true;rtUnbeep();}
  rtSave();rtDraw();}
function rtStop(){RT=null;rtSave();rtUnbeep();rtWake(false);clearInterval(rtInt);rtInt=0;clearTimeout(rtHide);rtDraw();}
function rtLoop(){if(!rtInt)rtInt=setInterval(rtTick,250);}
function rtTick(){
  if(!RT){clearInterval(rtInt);rtInt=0;return;}
  if(!RT.paused&&!RT.done&&rtLeft()<=0){RT.done=true;rtSave();rtWake(false);
    try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
    rtEl.setAttribute("aria-live","assertive");rtHide=setTimeout(rtStop,30000);}
  rtDraw();
}
function rtDraw(){
  document.body.classList.toggle("rt-on",!!RT);
  if(!RT){rtEl.classList.remove("show");return;}
  const left=rtLeft(),C=2*Math.PI*25,frac=RT.done?1:Math.max(0,Math.min(1,left/RT.total));
  const title=RT.done?(RT.kind==="hold"?"Done. Switch sides or move on":"Rest over. Go!"):RT.label;
  const sub=RT.done?(RT.kind==="hold"?RT.label:RT.label):(RT.paused?"Paused. Tap the clock to carry on":RT.sub);
  const sig=[RT.done,RT.paused,title,sub].join("|");
  if(rtEl._sig!==sig){rtEl._sig=sig;
    rtEl.innerHTML=`<button type="button" class="ring" data-rt="toggle" aria-label="${RT.done?"Close timer":RT.paused?"Resume timer":"Pause timer"}"><svg viewBox="0 0 58 58" aria-hidden="true"><circle class="bg" cx="29" cy="29" r="25"/><circle class="fg" cx="29" cy="29" r="25" stroke-dasharray="${C}"/></svg><span></span></button>
    <div class="rtx"><b>${esc(title)}</b><small>${esc(sub)}</small></div>
    <div class="rtb">${RT.done?`<button type="button" data-rt="again" aria-label="Start the same timer again">↻</button><button type="button" data-rt="stop" aria-label="Close timer">✕</button>`:`<button type="button" data-rt="-15" aria-label="15 seconds less">−15</button><button type="button" data-rt="15" aria-label="15 seconds more">+15</button><button type="button" data-rt="stop" aria-label="Skip rest">✕</button>`}</div>`;}
  rtEl.querySelector(".fg").style.strokeDashoffset=String(C*(1-frac));
  rtEl.querySelector(".ring span").textContent=RT.done?"0:00":clock(left);
  rtEl.classList.toggle("done",!!RT.done);rtEl.classList.toggle("paused",!!RT.paused);rtEl.classList.add("show");
}
rtEl.addEventListener("click",e=>{const b=e.target.closest("[data-rt]");if(!b)return;rtAudioUnlock();const a=b.dataset.rt;
  if(a==="toggle")rtToggle();else if(a==="stop")rtStop();else if(a==="again"){const r=RT;rtStart(r.total,r.label,r.sub,r.kind);}else rtAdjust(+a);});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&RT){rtTick();if(!RT.paused&&!RT.done){rtBeep(rtLeft());rtWake(true);}}});
if(RT){rtLoop();rtDraw();}
function exName(k,id){const e=exLookup(k,id);return e?e[1]:(LIB[id]?LIB[id].n:id);}
function afterTick(k,id,i,btn){
  rtAudioUnlock();
  if(tcfg().auto===false)return;
  const p=planOf(k),day=store.days[k]||{},ex=exLookup(k,id);if(!ex)return;
  const card=btn.closest(".ss");
  if(card){
    const ids=((card.querySelector("[data-ids]")||{}).dataset||{}).ids;const grp=ids?ids.split(","):[id];
    const infos=grp.map(g=>{const e=exLookup(k,g);return e?rowsInfo(day,e):{rc:0,types:[],rws:[]};});
    const j=grp.indexOf(id),L="ABCDEF";
    for(let n=j+1;n<grp.length;n++){if(i<infos[n].rc&&!(infos[n].rws[i]||{}).d){toast(`Straight into ${L[n]}: ${exName(k,grp[n])}, no rest`);return;}}
    if(grp.some((g,n)=>infos[n].types[i+1]==="d")){toast("Drop round next. No rest, cut the weight about 25–30%");return;}
    const more=infos.some(I=>i+1<I.rc);
    rtStart(restSecs(grp[grp.length-1],p,k),more?`Next: round ${i+2}`:"Next exercise",grp.map(g=>exName(k,g)).join(" + "));
    return;
  }
  const I=rowsInfo(day,ex);
  if(I.types[i+1]==="d"){toast("Drop set next. No rest, cut the weight about 25–30%");return;}
  let n=0;for(let x=0;x<=i+1&&x<I.rc;x++)if(I.types[x]!=="d")n++;
  const more=i+1<I.rc;
  rtStart(restSecs(id,p,k),more?`Next: set ${n}`:"Next exercise",ex[1]);
}
const RTOPTS=[30,45,60,75,90,120,150,180,240];
function restPickBody(id,k){
  const p=planOf(k),rec=restRec(id,p,k),ov=restOverride(id),def=tcfg().def>0?tcfg().def:0,cur=restSecs(id,p,k);
  return `<p class="note" style="margin-top:0">Recommended: <b>${secLabel(rec)}</b>${def?`. Your default for everything: <b>${secLabel(def)}</b>`:""}. Pick a time to use for this exercise from now on.</p>
  <div class="rtopts">${RTOPTS.map(s=>`<button type="button" data-rtpick="${s}" aria-pressed="${ov===s}">${secLabel(s).replace(" min","m").replace(" s","s")}</button>`).join("")}<button type="button" class="wide" data-rtpick="0" aria-pressed="${!ov}">Use ${def?"my default":"recommended"} (${secLabel(def||rec)})</button></div>
  <p class="note">Now: <b>${secLabel(cur)}</b>. The timer starts by itself when you tick a set.</p>`;
}
function openRestPick(id,k){
  openSheet("Rest time: "+exName(k,id),restPickBody(id,k),[{label:"Start timer now",fn:()=>{rtAudioUnlock();rtStart(restSecs(id,planOf(k),k),"Rest",exName(k,id));}},{label:"Done",cls:"btn ghost"}]);
  sheetEl._kind="restpick";sheetEl._rid=id;sheetEl._rk=k;
}
sheetEl.addEventListener("click",e=>{
  if(sheetEl._kind==="restpick"){const b=e.target.closest("[data-rtpick]");if(!b)return;const s=+b.dataset.rtpick,T=ensureT();T.ex=T.ex||{};
    if(s)T.ex[sheetEl._rid]=s;else delete T.ex[sheetEl._rid];persist("settings");sheetEl.querySelector(".sheet-b").innerHTML=restPickBody(sheetEl._rid,sheetEl._rk);if(tab==="train")renderTrain();return;}
  if(sheetEl._kind!=="settings")return;
  const b=e.target.closest("[data-rtset]");if(!b)return;const T=ensureT(),[key,val]=b.dataset.rtset.split(":");
  if(key==="clear"){const u=snap(["settings"]);T.ex={};persist("settings");refreshSettings();render();toast("Your rest times were cleared",u);return;}
  if(key==="def"){if(+val)T.def=+val;else delete T.def;}else{if(val==="on")delete T[key];else T[key]=false;}
  if(key==="sound"&&val==="on")rtAudioUnlock();
  persist("settings");refreshSettings();if(tab==="train")renderTrain();
});
function timerSettingsHtml(){
  const T=tcfg(),seg=(key,lab)=>`<p class="lbl" style="margin-top:12px">${lab}</p><div class="seg" role="group" aria-label="${lab}"><button type="button" data-rtset="${key}:on" aria-pressed="${T[key]!==false}">On</button><button type="button" data-rtset="${key}:off" aria-pressed="${T[key]===false}">Off</button></div>`;
  const n=Object.keys(T.ex||{}).length,def=T.def>0?T.def:0;
  return `<h3 style="margin:20px 0 4px;font-size:22px">Rest timer</h3>
  ${seg("auto","Start the timer when I tick a set")}${seg("sound","Beep when rest is over")}${seg("wake","Keep the screen on while it counts down")}
  <p class="lbl" style="margin-top:12px">Rest time</p><div class="rtopts"><button type="button" class="wide" data-rtset="def:0" aria-pressed="${!def}">Recommended for each exercise</button>${[60,90,120,180].map(s=>`<button type="button" data-rtset="def:${s}" aria-pressed="${def===s}">${secLabel(s).replace(" min","m").replace(" s","s")}</button>`).join("")}</div>
  <p class="note">Tap the ⏱ time on any exercise to set its own rest time.${n?` You've set ${n}. <button type="button" class="linkbtn" data-rtset="clear:1">Clear them</button>`:""}</p>`;
}
// ---------- Start ----------
loadLocal();render();
setStatus("Saved in this browser.");
(async()=>{
  const c=window.claude;
  if(!c||typeof c.use!=="function"){setStatus("Saved in this browser only.");return;}
  try{
    const [d,u]=await Promise.all([c.use("db"),c.use("user")]);
    if(d&&u){const id=await u.id();if(id){db=d;uid=id;mode="db";subscribe();setStatus("Saved to your Claude account and synced across your devices.");return;}}
  }catch(e){}
  setStatus("Saved in this browser only.");
})();
})();
