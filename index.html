function schoolHtml(){
  const L=Object.values(LIB),ch=(t,body,open)=>`<details${open?" open":""}><summary>${t}</summary><div class="ab">${body}</div></details>`;
  const best=m=>L.filter(x=>x.m.includes(m)).sort((a,b)=>diffOf(a.id)-diffOf(b.id)||a.n.localeCompare(b.n)).slice(0,5).map(x=>esc(x.n)).join(", ");
  let h=`<p class="note" style="margin:0 0 12px">Everything behind the app's plans, in plain words. Take what's useful. For how each exercise is done, see the <button type="button" class="linkbtn" style="padding:0" data-sp="library">exercise library</button>.</p>`;
  h+=`<h2 class="gtitle" data-rail="Movements">Movements</h2><div class="acc">`+
  ch("Compound and isolation exercises",`<p><b>Compound</b> exercises move more than one joint and train several muscles at once, like squats, bench press, rows and pull-ups. They let you lift the most weight, so they're the base of most plans and come first in a workout, while you're fresh.</p>
   <p><b>Isolation</b> exercises move one joint and focus on one muscle, like curls, lateral raises and leg extensions. They're great for muscles that compound lifts don't hit hard, such as side delts, biceps and calves, and are easier to recover from.</p>
   <p>A good plan uses both: 2–3 compound lifts, then 2–4 isolation exercises.</p>
   <table><tr><th>Compound</th><th>Isolation</th></tr><tr><td>Squat, leg press, lunges</td><td>Leg extension, leg curl</td></tr><tr><td>Bench press, dips, pushups</td><td>Chest fly, triceps pushdown</td></tr><tr><td>Rows, pull-ups, pulldowns</td><td>Biceps curl, face pull</td></tr><tr><td>Overhead press</td><td>Lateral raise</td></tr><tr><td>Romanian deadlift, hip thrust</td><td>Calf raise, abductor machine</td></tr></table>
   <p>In this app, ${L.filter(compoundOf).length} of the ${L.length} exercises count as compound.</p>`,true)+
  ch("Movement patterns",`<p>Most exercises fit into a few patterns. Covering each one every week gives you a balanced body.</p><ul><li><b>Squat:</b> squats, leg press, lunges. Quads and glutes.</li><li><b>Hinge:</b> deadlifts, Romanian deadlifts, hip thrusts, kettlebell swings. Glutes, hamstrings and lower back.</li><li><b>Horizontal push:</b> bench press, pushups. Chest, front delts, triceps.</li><li><b>Vertical push:</b> overhead press. Shoulders and triceps.</li><li><b>Horizontal pull:</b> rows. Mid-back, lats, rear delts.</li><li><b>Vertical pull:</b> pull-ups, pulldowns. Lats and biceps.</li><li><b>Carry and core:</b> farmer's carries, planks, leg raises.</li></ul>`)+
  ch("Free weights, machines and cables",`<p><b>Free weights</b> (barbells, dumbbells, kettlebells) make you balance the weight, which trains stabilising muscles and carries over well to real life and sport.</p><p><b>Machines</b> guide the movement. They're easier to learn, safer to push close to failure, and great for beginners and for isolation work.</p><p><b>Cables</b> keep tension on the muscle through the whole movement and are easy to adjust.</p><p><b>Bodyweight</b> exercises can be just as effective: make them harder with slower reps, more reps, or a harder version (see Move up on calisthenics exercises).</p>`)+`</div>`;
  h+=`<h2 class="gtitle" data-rail="Muscles">Muscles and what trains them</h2><div class="acc">`+Object.keys(MDESC).map(m=>ch(esc(MNAME[m].replace(/^./,c=>c.toUpperCase())),`<p>${MDESC[m]}</p><p><b>Good exercises:</b> ${best(m)||"see the library"}.</p>`)).join("")+`</div>`;
  h+=`<h2 class="gtitle" data-rail="Splits">Splits</h2><div class="acc">`+
  ch("What a split is",`<p>A split is how you spread your training over the week. The best split is the one you can stick to. What matters most is training each muscle about twice a week with enough hard sets, and recovering between sessions.</p>`,false)+
  ch("Full body, 2–4 days",`<p><b>What it is:</b> every workout trains your whole body.</p><p><b>Good for:</b> beginners, busy weeks, and anyone who can only train 2–3 times a week.</p><p><b>Pros:</b> each muscle gets trained 2–3 times a week, and missing a day doesn't leave a muscle untrained.</p><p><b>Cons:</b> sessions can get long, and leg and back work in the same day is tiring.</p>`)+
  ch("Upper and lower, 4 days",`<p><b>What it is:</b> alternate upper body and lower body days, usually Mon, Tue, Thu, Fri.</p><p><b>Good for:</b> people past the beginner stage who want more volume.</p><p><b>Pros:</b> each muscle twice a week, shorter sessions than full body, easy to recover from.</p><p><b>Cons:</b> upper days have a lot to fit in.</p>`)+
  ch("Push, pull, legs, 3–6 days",`<p><b>What it is:</b> push days (chest, shoulders, triceps), pull days (back, biceps) and leg days. Run once (3 days) or twice (6 days) a week.</p><p><b>Good for:</b> intermediate lifters who enjoy training often.</p><p><b>Pros:</b> logical grouping, lots of volume per muscle.</p><p><b>Cons:</b> done only 3 days a week, each muscle gets trained just once.</p>`)+
  ch("Upper, lower, push, pull, legs, 5 days",`<p><b>What it is:</b> a mix of upper/lower and push/pull/legs, so every muscle is trained about twice a week in five sessions.</p><p><b>Good for:</b> people who can train five days and want balance between strength and size.</p>`)+
  ch("Body part split (bro split), 5 days",`<p><b>What it is:</b> one muscle group per day, like chest day, back day, arm day.</p><p><b>Pros:</b> you can hit one muscle very hard, and it's simple to follow.</p><p><b>Cons:</b> each muscle is trained only once a week, which for most people builds muscle slower than twice a week with the same total sets.</p>`)+
  ch("Hybrid and Hyrox",`<p><b>What it is:</b> strength training mixed with running, ergs and conditioning, so you get strong <i>and</i> fit. The app's Hybrid and Hyrox template has lower body plus intervals, upper body plus SkiErg or rowing, a Hyrox simulation day, a power day and a long easy run.</p><p><b>Good for:</b> Hyrox racers, people who want to look and perform well, and anyone bored of lifting only.</p><p><b>Pros:</b> great all-round fitness and heart health.</p><p><b>Cons:</b> recovery is harder because running and lifting both tire your legs. Eat enough carbs and keep easy runs truly easy.</p>`)+`</div>`;
  h+=`<h2 class="gtitle" data-rail="Training">Training basics</h2><div class="acc">`+
  ch("Sets, reps and how hard to go",`<ul><li><b>Strength:</b> 1–6 reps with heavy weight.</li><li><b>Muscle growth:</b> anywhere from about 6 to 20 reps works, as long as sets end close to failure.</li><li><b>Endurance:</b> 15+ reps, or time and distance.</li></ul><p>Most sets should end with 1–3 reps left in the tank (RIR). Going to failure now and then is fine, especially on machines and isolation exercises.</p><p><b>How many sets:</b> about 10–20 hard sets per muscle per week is a good range for growth. Beginners grow well on less. The Body tab shows your sets per muscle.</p>`)+
  ch("Progressive overload",`<p>To keep improving, you have to slowly do more over time: more weight, more reps, or more sets. The simplest way is <b>double progression</b>: pick a rep range, like 8–12. When you hit 12 on every set, add a little weight and start again at 8. The app tells you when you're ready.</p>`)+
  ch("Rest between sets",`<p>Heavy compound lifts: 2–3 minutes. Smaller exercises: 60–90 seconds. Resting long enough lets you do more reps, which builds more muscle than rushing. The rest timer starts by itself when you tick a set.</p>`)+
  ch("Recovery and sleep",`<p>Muscle grows between workouts, not during them. Sleep 7–9 hours, eat enough protein, and leave about 48 hours before training the same muscle hard again. Every 6–10 weeks, an easier week (a deload) with fewer sets can help you come back stronger.</p>`)+
  ch("Warm-ups and form",`<p>Start with 3–5 minutes of light movement, then a few light warm-up sets of your first exercise. Learn the movement with light weight first. If your form breaks down, the weight is too heavy.</p>`)+
  ch("Cardio: easy and hard",`<p><b>Easy (zone 2):</b> a pace where you can still talk. It builds your aerobic base, helps recovery and barely affects your lifting. Most of your running should be easy.</p><p><b>Hard (intervals):</b> short, hard efforts with rest, like 400 m repeats. They raise your top speed and fitness fast but are tiring, so 1–2 sessions a week is plenty.</p><p>Doing cardio and lifting on the same day? Lift first if muscle and strength are your priority.</p>`)+`</div>`;
  h+=`<h2 class="gtitle" data-rail="Hyrox">Hyrox</h2><div class="acc">`+
  ch("How a Hyrox race works",`<p>8 rounds of a 1 km run followed by a workout station. Every race uses the same order:</p><ol><li>SkiErg, 1,000 m</li><li>Sled push, 50 m</li><li>Sled pull, 50 m</li><li>Burpee broad jumps, 80 m</li><li>Rowing, 1,000 m</li><li>Farmer's carry, 200 m</li><li>Sandbag lunges, 100 m</li><li>Wall balls, 100 reps</li></ol><p>Weights depend on your division. In the Open division, men push and pull a heavier sled, carry 2 × 24 kg and use a 20 kg sandbag and 6 kg wall ball. Women carry 2 × 16 kg with a 10 kg sandbag and 4 kg ball. Check the official rules for your season, as they can change.</p>`)+
  ch("How to train for it",`<ul><li><b>Running</b> is about half your race time, so run 2–4 times a week, mostly easy.</li><li><b>Compromised running:</b> practise running straight after a station, when your legs feel heavy.</li><li><b>Strength:</b> squats, lunges, deadlifts and pulling make the sled and lunges much easier.</li><li><b>Station practice:</b> learn efficient technique for wall balls, burpee broad jumps and the sled.</li><li><b>Pacing:</b> the most common mistake is going out too fast on the first run.</li></ul>`)+`</div>`;
  h+=`<h2 class="gtitle" data-rail="Nutrition">Nutrition basics</h2><div class="acc">`+
  ch("Calories",`<p>Your weight changes with the balance between what you eat and what you burn. Eat about 300–500 kcal under maintenance to lose fat steadily, and a little above to build muscle with little fat. The Body tab works out your real maintenance from your logs.</p>`)+
  ch("Protein",`<p>About 1.6–2.2 g per kg of body weight a day, at the higher end when you're cutting. Spread it over 3–5 meals with 20–40 g each.</p>`)+
  ch("Carbs and fats",`<p>Carbs fuel hard training, especially running and Hyrox. Fats are needed for hormones: keep them at about 20–35% of your calories. Within that, eat what you enjoy and can stick to.</p>`)+
  ch("Fibre, fruit and vegetables",`<p>Aim for about 30 g of fibre a day and plenty of fruit and vegetables. They keep you full, help digestion and cover most vitamins and minerals. The food calculator shows fibre for each ingredient.</p>`)+`</div>`;
  h+=`<h2 class="gtitle" data-rail="Words">Words you'll see</h2><div class="acc">`+ch("Glossary",`<ul>${Object.entries(GLOSS).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>`<li><b>${esc(k.replace(/^./,c=>c.toUpperCase()))}:</b> ${esc(v)}</li>`).join("")}</ul>`)+`</div>`;
  return h;
}
// ---------- Guide ----------
function guideHtml(){
  const ua=navigator.userAgent||"",ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1),android=/Android/.test(ua);
  let n=0;const ch=(t,b)=>`<details><summary><span><span class="chn">${++n}</span>${t}</span></summary><div class="gb">${b}</div></details>`;
  const iosB=`<ol><li>Open the app's web address in <b>Safari</b>. Chrome on iPhone works too, through the same Share menu.</li><li>Tap <b>Share</b>: the square with an arrow pointing up. On newer iPhones it's behind <kbd>•••</kbd> at the bottom right.</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Leave <b>Open as Web App</b> on if you see it, then tap <b>Add</b>.</li></ol>`;
  const andB=`<ol><li>Open the app's web address in <b>Chrome</b>.</li><li>Tap <kbd>⋮</kbd> at the top right.</li><li>Tap <b>Add to Home screen</b> or <b>Install app</b>, then confirm.</li></ol><p>Samsung Internet: <kbd>☰</kbd> → <b>Add page to</b> → <b>Home screen</b>.</p>`;
  let h=`<div class="guide"><button type="button" class="btn" style="margin:0 0 12px" data-gtour>Take the tour again</button>
  <p class="gtitle">Using the app</p>`;
  h+=ch("Getting started",`<p>Setup asks for your details to work out your calories and protein, then your gym experience, then your weekly split. Change any of it later: targets in <b>Body</b>, your split with <b>Edit</b> on the Train tab, and your experience level in <b>Settings → Training</b>.</p><p>Use <kbd>‹</kbd> and <kbd>›</kbd> at the top to move between days, or tap a circle in the week strip. Everything saves as you type.</p>`);
  h+=ch("Train: logging a workout",`<ul><li>Warm-up, stretches and every exercise are folded into one line with a <b>progress circle</b>. The exercise you're on opens by itself. When you finish its last set it folds away with a tick, and the next one opens. Tap any line to open it.</li><li>Type the weight and reps, then tap <kbd>✓</kbd>. That starts the rest timer. Running and erg exercises ask for metres and minutes, and sled and carry stations for weight and metres.</li><li>Tap <kbd>⌄</kbd> next to a set to see what you did on that set last time, and your best.</li><li><b>+ Set</b> and <b>+ Drop set</b> add rows. Tap a set's number to switch it between a normal set and a drop set. Drag <kbd>⋮⋮</kbd> to reorder.</li><li>Swipe a set left to delete it. Deleted something by mistake? Tap <b>Undo</b>.</li><li>Beat your best and you'll see a <b>New record</b> message. Once you've logged a set, a summary shows your sets, total weight, time and the calories you burned.</li><li>Hold and slide the <b>bar on the right edge</b> to jump between sections on any long page.</li></ul>`);
  h+=ch("Train: exercise options",`<ul><li><b>Tap an exercise's name</b> to swap it (today or every time), remove it for today, open the how-to, add a note, pick a rep style, or use the plate calculator for barbell lifts.</li><li>The <b>magnifying glass</b> shows how to do it: the movement, muscles worked and form tips. The <b>pen</b> adds a note, like seat height.</li><li>The swap list is grouped by muscle, with the same muscle group first.</li><li>New and Some experience see a suggested starting weight the first time, and a reminder to focus on form.</li></ul>`);
  h+=ch("Train: your plan and layout",`<ul><li><b>Edit</b>, at the top right under the week, opens everything you can change: the order of the sections on the page (so the warm-up can come after), which sections show, your own warm-ups and stretches, the exercises in each workout, and your weekly schedule.</li><li><b>Change your weekly split</b> lets you pick a template, set each day, add custom or Dynamic days, and choose how long the split runs.</li><li>On a <b>Dynamic</b> day you pick which workout to do on the day itself.</li><li><b>Tap the workout's name</b> at the top to switch just this day to a different workout. The <b>?</b> next to it explains the workout.</li></ul>`);
  h+=ch("Rest timer",`<p>Starts by itself when you tick a set, with the right rest for that exercise and rep style. Tap the clock to pause, <b>−15</b>/<b>+15</b> to adjust, <kbd>✕</kbd> to skip. Before a drop set or between exercises in a superset it tells you to keep going. Tap the <b>▶</b> time on any exercise to start resting straight away. Hold it to pick a different time for that exercise. Stretches have a <b>▶</b> hold timer.</p><p>On iPhone the beep can't play while the screen is locked, so keep <b>Keep the screen on</b> switched on in Settings → Rest timer, and check the silent switch.</p>`);
  h+=ch("Eat",`<ul><li>The bar at the top shows calories and protein against your targets.</li><li>Each meal is folded into one line. Tap it to open, then tick what you ate.</li><li><b>Supplements:</b> add one from the common list to see what it's for, when to take it and what to watch out for (the magnifying glass). The pen adds your own note, like how it affects you.</li><li>Swipe a meal right to edit it, left to remove it.</li><li>The <b>food calculator</b> works out any ingredient by weight. Use the <b>meal builder</b> to combine several and save the result as a meal.</li><li><b>Recipes</b> show ingredients and steps. Tap <b>Log 1 serving today</b> after eating one, or add your own.</li></ul>`);
  h+=ch("Body",`<ul><li>Weigh in each morning. The <b>Progress</b> chart shows each weigh-in and the 7-day average. Tap the chart to see the numbers.</li><li><b>Calories burned</b> estimates today's total and what your training has burned since you started.</li><li><b>Your real maintenance</b> appears after about two weeks of logging weight and food. It's more accurate than any formula.</li><li><b>Sets per muscle</b>, <b>Strength</b>, <b>Measurements</b>, <b>Progress photos</b> and <b>Notes</b> sit further down.</li></ul>`);
  h+=ch("Spend and History",`<p><b>Spend</b> works out what your food and supplements cost per week, two weeks or month, grouped by store. Add products with how long they last, then tap a store and a product to log a purchase.</p><p><b>History</b> shows a month at a glance. Tap any day to open it.</p>`);
  h+=ch("Settings and the tab bar",`<p>Theme and colours, the tab bar (reorder with the arrows, hide Body, Spend or History), Training (experience, rep style, tips, keyword explanations), units and currency, rest timer, backups, and this help. Hidden tabs open from <b>Settings → Tab bar</b>.</p>`);
  h+=ch("Install it as an app",`<p>Body Builder can be installed on iPhone, Android and computers, and then works offline. Step-by-step instructions are in <b>Settings → Install as an app</b>.</p>`);
  h+=ch("Your data and backups",`<p>${isLocalMode()?"Everything is saved on this phone or browser only. Nobody else can see it, and everyone who uses the app has their own data. Use <b>Settings → Backup</b> now and then, and to move to a new phone. Progress photos stay on the phone and aren't in backups.":"Your data is saved to your Claude account and syncs between your devices."}</p>`);
  h+=`<p class="gtitle">Training basics</p>`;
  h+=ch("How muscle grows",`<p>Muscle grows when you train it hard enough to send a signal, eat enough protein to repair it, and recover between sessions. Training is the signal, food and sleep do the building. You don't grow in the gym, you grow in the days after.</p><p>For most people, training each muscle about twice a week with 10–20 hard sets in total gives the best results.</p>`);
  h+=ch("Sets, reps and rest",`<ul><li>A <b>rep</b> is one movement. A <b>set</b> is a group of reps done without stopping.</li><li>Muscle grows across a wide range, from about 5 to 30 reps, as long as the set ends close to failure.</li><li>Rest 2–3 minutes after heavy compound lifts like squats and presses, and 60–90 seconds after smaller exercises. Resting too little makes the next set weaker.</li><li>Stop most sets with 1–3 reps left <b>in the tank</b>. Going all the way to failure on every set adds fatigue without much extra benefit.</li></ul>`);
  h+=ch("Rep styles: light, medium and heavy",`<ul><li><b>Heavy (4–6 reps)</b> builds the most strength. It needs longer rest and more care with form.</li><li><b>Medium (8–12)</b> is the sweet spot for muscle growth for most exercises.</li><li><b>Light (12–20)</b> suits isolation work like lateral raises, and is easier on the joints.</li></ul><p>A good plan mixes them: heavier for big lifts, lighter for small muscles.</p>`);
  h+=ch("Progressive overload",`<p>To keep improving, slowly ask more of your muscles: one more rep, a little more weight, or one more set. A simple method is <b>double progression</b>. Pick a rep range like 8–12. When you reach 12 on every set, add the smallest weight step and work back up from 8.</p><p>The app tells you when you've hit the top of the range, and for calisthenics suggests the next harder variation.</p>`);
  h+=ch("Warming up and form",`<ul><li>Start with 3–5 minutes of light movement, then a few <b>ramp-up sets</b> of your first exercise, for example 50% and then 75% of your working weight.</li><li>Good form means a full, controlled range of motion. Lower the weight in 2–3 seconds and don't bounce.</li><li>If your form breaks down, the weight is too heavy. Lower it. Ego lifting is the fastest way to get injured.</li><li>Sharp or joint pain is a stop sign. Normal muscle burn and soreness the next day are fine.</li></ul>`);
  h+=ch("Supersets and drop sets",`<p>A <b>superset</b> is two exercises back to back, then rest. It saves time and works best for opposite or unrelated muscles, like biceps and triceps.</p><p>A <b>drop set</b> means lowering the weight by about 25–30% straight after your last set and going to failure again. It adds a lot of work in little time. Use it on machines and isolation exercises, not heavy barbell lifts.</p>`);
  h+=ch("Calisthenics",`<p>Bodyweight training uses <b>progressions</b> instead of adding weight: you move to a harder version of the exercise. For example, knee pushups → pushups → diamond pushups → archer pushups. When you can do the top of the rep range on every set, move up a step. The app shows a <b>Move up</b> button when you're ready.</p>`);
  h+=ch("Recovery and sleep",`<ul><li>Aim for 7–9 hours of sleep. Muscle repair and hormone release happen mostly while you sleep.</li><li>Give a muscle about 48 hours before training it hard again.</li><li>Every 6–10 weeks, an easier <b>deload</b> week (about half the sets) helps you come back stronger.</li></ul>`);
  h+=ch("Calories, protein and your goal",`<ul><li>To <b>lose fat</b>, eat a bit less than you burn: 300–500 kcal under maintenance is about 0.3–0.5 kg a week. Keep protein high and keep lifting so the weight you lose is fat, not muscle.</li><li>To <b>build muscle</b>, eat 200–300 kcal over maintenance. Gaining faster than about 0.25–0.5 kg a week mostly adds fat.</li><li><b>Protein</b>: about 1.6–2.2 g per kg of body weight a day, at the higher end when cutting, spread over 3–5 meals.</li><li>The calorie calculator is a starting point. After 2–3 weeks, your weight trend shows your real maintenance, and the Body tab works it out for you.</li></ul>`);
  h+=ch("Tracking your weight properly",`<p>Your weight can swing 1–2 kg from day to day because of water, salt, carbs and digestion. Weigh in every morning after the bathroom, before eating, and judge progress by the <b>weekly average</b>. Measurements and photos help too, because you can lose fat and gain muscle at the same weight.</p>`);
  return h+`</div>`;
}

// ---------- Backup (website version) ----------
function isLocalMode(){return mode==="local";}
function backupHtml(){
  return `
  <p class="note" style="margin-top:0">Save all your workouts, food, weights and settings as one file, to keep it safe or move it to another phone.</p>
  <div class="pair"><button type="button" class="btn ghost" data-bk="export">Download backup</button><label class="btn ghost" style="display:grid;place-items:center;cursor:pointer">Restore backup<input type="file" accept=".json,application/json" data-bk="import" hidden></label></div>
  <button type="button" class="linkbtn" style="margin-top:10px;color:var(--red)" data-bk="wipe">Delete all my data on this device</button>`;
}
function bkExport(){
  try{const blob=new Blob([JSON.stringify({app:"body-builder",v:1,saved:new Date().toISOString(),days:store.days,settings:store.settings},null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="body-builder-backup-"+todayKey()+".json";document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);toast("Backup downloaded");}catch(e){toast("Couldn't make the backup file");}
}
function bkImport(file){
  const r=new FileReader();
  r.onload=()=>{let o;try{o=JSON.parse(r.result);}catch(e){toast("That file isn't a Body Builder backup");return;}
    if(!o||typeof o!=="object"||typeof o.days!=="object"||typeof o.settings!=="object"){toast("That file isn't a Body Builder backup");return;}
    if(!confirm("Replace everything on this device with the backup from "+(o.saved?new Date(o.saved).toLocaleDateString():"that file")+"?"))return;
    for(const k of Object.keys(store.days))delete store.days[k];for(const k of Object.keys(store.settings))delete store.settings[k];
    Object.assign(store.days,o.days);Object.assign(store.settings,o.settings);saveLocal();closeSheet();render();toast("Backup restored");};
  r.readAsText(file);
}
bothOn("click",e=>{if(!inSettings(e))return;const b=e.target.closest("[data-bk]");if(!b)return;
  if(b.dataset.bk==="export")bkExport();
  else if(b.dataset.bk==="wipe"){if(!confirm("Delete all your workouts, food, weights and settings on this device? This can't be undone, so download a backup first if you might want them."))return;
    try{localStorage.removeItem(LS_KEY);}catch(err){}for(const k of Object.keys(store.days))delete store.days[k];for(const k of Object.keys(store.settings))delete store.settings[k];Object.assign(store.settings,{kcal:2000,protein:150});welcomeManual=false;closeSheet();render();toast("All data deleted");}});
bothOn("change",e=>{if(!inSettings(e))return;const t=e.target;if(t.dataset.bk==="import"&&t.files&&t.files[0])bkImport(t.files[0]);});
$("panel").addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.bk==="restore"&&t.files&&t.files[0])bkImport(t.files[0]);});
// ---------- Rest timer ----------
function tcfg(){return store.settings.timer||{};}
function ensureT(){return store.settings.timer||(store.settings.timer={});}
function parseSecs(s){
  if(!s)return 0;const n=(String(s).match(/\d+(\.\d+)?/g)||[]).map(Number);if(!n.length)return 0;
  let v=n.length>1?(n[0]+n[1])/2:n[0];if(/min/.test(s))v*=60;return Math.round(v/15)*15||v;
}
function holdSecs(h){if(!h||/rep|breath/i.test(h))return 0;const n=(String(h).match(/\d+/g)||[]).map(Number);if(!n.length)return 0;let v=Math.max(...n);if(/min/.test(h))v*=60;return v;}
function restOverride(id){const o=(tcfg().ex||{})[id];return o>0?o:0;}
function restRec(id,p,k){return parseSecs(restFor(id,p,k))||90;}
function restSecs(id,p,k){return restOverride(id)||(tcfg().def>0?tcfg().def:(styleRest(id)||restRec(id,p,k)));}
function secLabel(s){s=Math.round(s);if(s<60)return s+" s";const m=Math.floor(s/60),r=s%60;return r?m+":"+String(r).padStart(2,"0")+" min":m+" min";}
const clock=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
const rtEl=document.createElement("div");rtEl.id="rt";rtEl.setAttribute("role","timer");rtEl.setAttribute("aria-live","off");document.body.appendChild(rtEl);
let RT=null,rtInt=0,actx=null,beeps=[],wake=null,rtHide=0;
try{const s=JSON.parse(localStorage.getItem("bb-rt")||"null");if(s&&s.end&&(s.paused||s.end>Date.now()-60000))RT=s;}catch(e){}
function rtSave(){try{RT?localStorage.setItem("bb-rt",JSON.stringify(RT)):localStorage.removeItem("bb-rt");}catch(e){}}
function rtAudioUnlock(){
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!actx)actx=new C();if(actx.state==="suspended")actx.resume();
    const o=actx.createOscillator(),g=actx.createGain();g.gain.value=0;o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.01);}catch(e){}
}
function rtUnbeep(){beeps.forEach(o=>{try{o.stop();}catch(e){}});beeps=[];}
function rtBeep(inSec){
  rtUnbeep();if(!actx||tcfg().sound===false)return;
  try{const t0=actx.currentTime+Math.max(0,inSec);
    [0,.28,.56].forEach((d,j)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=j===2?1320:880;
      g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(.35,t0+d+.02);g.gain.linearRampToValueAtTime(0,t0+d+(j===2?.4:.18));
      o.connect(g).connect(actx.destination);o.start(t0+d);o.stop(t0+d+.45);beeps.push(o);});}catch(e){}
}
async function rtWake(on){
  try{if(on&&tcfg().wake!==false&&"wakeLock" in navigator&&!wake&&document.visibilityState==="visible"){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null;});}
    else if(!on&&wake){await wake.release();wake=null;}}catch(e){wake=null;}
}
function rtLeft(){return RT?(RT.paused?RT.left:(RT.end-Date.now())/1000):0;}
function rtStart(secs,label,sub,kind){
  if(!(secs>0))return;clearTimeout(rtHide);
  RT={end:Date.now()+secs*1000,total:secs,label,sub:sub||"",kind:kind||"rest",paused:false,left:0,done:false};
  rtSave();rtBeep(secs);rtWake(true);rtLoop();rtDraw();
}
function rtAdjust(d){if(!RT||RT.done)return;if(RT.paused){RT.left=Math.max(1,RT.left+d);}else{RT.end=Math.max(Date.now()+1000,RT.end+d*1000);rtBeep(rtLeft());}RT.total=Math.max(RT.total,rtLeft());rtSave();rtDraw();}

  rtSave();rtDraw();}
function rtStop(){RT=null;rtSave();rtUnbeep();rtWake(false);clearInterval(rtInt);rtInt=0;clearTimeout(rtHide);rtDraw();}
function rtLoop(){if(!rtInt)rtInt=setInterval(rtTick,250);}
function rtTick(){

function rtDraw(){

  const left=rtLeft(),C=2*Math.PI*25,frac=RT.done?1:Math.max(0,Math.min(1,left/RT.total));
  const title=RT.done?(RT.kind==="hold"?"Done. Switch sides or move on":"Rest over. Go!"):RT.label;
  const sub=RT.done?(RT.kind==="hold"?RT.label:RT.label):(RT.paused?"Paused. Tap the clock to carry on":RT.sub);
  const sig=[RT.done,RT.paused,title,sub].join("|");
  if(rtEl._sig!==sig){rtEl._sig=sig;
    rtEl.innerHTML=`<button type="button" class="ring" data-rt="toggle" aria-label="${RT.done?"Close timer":RT.paused?"Resume timer":"Pause timer"}"><svg viewBox="0 0 58 58" aria-hidden="true"><circle class="bg" cx="29" cy="29" r="25"/><circle class="fg" cx="29" cy="29" r="25" stroke-dasharray="${C}"/></svg><span></span></button>
    <div class="rtx"><b>${esc(title)}</b><small>${esc(sub)}</small></div>

  rtEl.querySelector(".fg").style.strokeDashoffset=String(C*(1-frac));

rtEl.addEventListener("click",e=>{const b=e.target.closest("[data-rt]");if(!b)return;rtAudioUnlock();const a=b.dataset.rt;
  if(a==="toggle")rtToggle();else if(a==="stop")rtStop();else if(a==="again"){const r=RT;rtStart(r.total,r.label,r.sub,r.kind);}else rtAdjust(+a);});

function exName(k,id){const e=exLookup(k,id);return e?e[1]:(LIB[id]?LIB[id].n:id);}
function afterTick(k,id,i,btn){
  rtAudioUnlock();
  {const d=store.days[k]||{},r=((d.sets||{})[id]||[])[i],e=libArr(id);if(r){r.at=Date.now();persist("day-"+k);if(isRecord(id,k,r,e[4])){setTimeout(()=>toast("New record on "+e[1]+": "+setText(r,e[4]).replace(/&times;/g,"×")),50);}}}
  if(tcfg().auto===false)return;
  const p=planOf(k),day=store.days[k]||{},ex=exLookup(k,id);if(!ex)return;
  const card=btn.closest(".ss");
  if(card){
    const ids=((card.querySelector("[data-ids]")||{}).dataset||{}).ids;const grp=ids?ids.split(","):[id];
    const infos=grp.map(g=>{const e=exLookup(k,g);return e?rowsInfo(day,e):{rc:0,types:[],rws:[]};});
    const j=grp.indexOf(id),L="ABCDEF";
    for(let n=j+1;n<grp.length;n++){if(i<infos[n].rc&&!(infos[n].rws[i]||{}).d){toast(`Straight into ${L[n]}: ${exName(k,grp[n])}, no rest`);return;}}
    if(grp.some((g,n)=>infos[n].types[i+1]==="d")){toast("Drop round next. No rest, cut the weight about 25–30%");return;}
    const more=infos.some(I=>i+1<I.rc);
    rtStart(restSecs(grp[grp.length-1],p,k),more?`Next: round ${i+2}`:"Next exercise",grp.map(g=>exName(k,g)).join(" + "));
    return;
  }
  const I=rowsInfo(day,ex);
  if(I.types[i+1]==="d"){toast("Drop set next. No rest, cut the weight about 25–30%");return;}
  let n=0;for(let x=0;x<=i+1&&x<I.rc;x++)if(I.types[x]!=="d")n++;
  const more=i+1<I.rc;
  rtStart(restSecs(id,p,k),more?`Next: set ${n}`:"Next exercise",ex[1]);

const RTOPTS=[30,45,60,75,90,120,150,180,240];

// ---- Tap to start, hold to change ----
const holdS={el:null,t:0,held:false,x:0,y:0,ticks:[]};

  holdS.ticks=[150,300].map(t=>setTimeout(()=>haptic(6),t));
  holdS.t=setTimeout(()=>{if(holdS.el!==b)return;holdS.held=true;b.classList.remove("holding");haptic(25);openRestPick(b.dataset.id,sel);},480);});

document.addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest("[data-hold]"))e.preventDefault();});
$("panel").addEventListener("click",e=>{const b=e.target.closest("[data-hold]");if(!b)return;if(holdS.held){holdS.held=false;return;}

bothOn("click",e=>{

// ---------- Section rail: a scrubber on the right edge ----------
// Spans the space between the header and the tab bar. Its size never depends on page length:
// every section gets an equal share, the thumb shows where you are, and dragging jumps between sections.
const railEl=document.createElement("nav");railEl.id="rail";railEl.setAttribute("aria-label","Jump to a section");

document.body.appendChild(railEl);railEl.addEventListener("click",e=>e.preventDefault());
let railItems=[],railSig="";const railS={on:false,i:-1};
function railLabel(e){if(e.dataset.rail)return e.dataset.rail;const c=e.cloneNode(true);c.querySelectorAll("small,.pring,.secic,svg").forEach(x=>x.remove());return c.textContent.trim();}
function railBuild(){
  if(railS.on)return;
  const els=[...document.querySelectorAll("#panel [data-rail], #panel h2.sec-title:not([data-rail]), #panel h2.gtitle:not([data-rail])")].filter(e=>e.getClientRects().length);
  const show=els.length>=3&&document.documentElement.scrollHeight>innerHeight*1.6&&!document.body.classList.contains("onboarding")&&!document.body.classList.contains("touring");
  railItems=show?els:[];railEl.classList.toggle("on",show);
  const sig=show?els.length+"|"+els.map(railLabel).join("|"):"";
  if(sig!==railSig){railSig=sig;railEl.querySelector(".rticks").innerHTML=els.map((_,i)=>`<i style="top:${els.length>1?i/(els.length-1)*100:50}%"></i>`).join("");}
  railSync();
}
// Where we are, as a fraction between sections, so the thumb moves smoothly while scrolling
function railPos(){const n=railItems.length;if(n<2)return 0;const y=innerHeight*0.32,tops=railItems.map(e=>e.getBoundingClientRect().top);
  if(innerHeight+scrollY>=document.documentElement.scrollHeight-4)return n-1;
  if(tops[0]>y)return 0;for(let i=0;i<n-1;i++)if(tops[i+1]>y)return i+(y-tops[i])/Math.max(1,tops[i+1]-tops[i]);return n-1;}
function railSync(){if(!railItems.length)return;const n=railItems.length,p=railS.on?railS.i:railPos();railEl.style.setProperty("--rp",(n>1?p/(n-1):0).toFixed(4));
  const cur=Math.round(p);railEl.querySelectorAll(".rticks i").forEach((t,i)=>t.classList.toggle("cur",i===cur));}

function railAt(y){const t=railEl.querySelector(".rtrack").getBoundingClientRect(),n=railItems.length;return Math.max(0,Math.min(n-1,Math.round((y-t.top)/Math.max(1,t.height)*(n-1))));}
function railShow(i){const bb=railEl.querySelector(".rbubble"),t=railEl.querySelector(".rtrack").getBoundingClientRect(),n=railItems.length;
  bb.textContent=railLabel(railItems[i]);bb.style.top=(t.top+(n>1?i/(n-1):0.5)*t.height)+"px";railS.i=i;railSync();}
